<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic timeline (preview) — jerminaldecline</title>
<style>
  :root {
    --bg: #0f1419;
    --bg-elev: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --text-faint: #6e7681;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5; padding: 32px 16px;
  }
  .container { max-width: 980px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0; }
  .panel {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px 24px;
  }
  .toggles {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 14px; min-height: 28px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px 4px 12px; border-radius: 14px;
    font-size: 12px; font-family: inherit; color: var(--text);
    cursor: pointer; background: transparent; transition: background 0.1s;
  }
  .chip:hover { background: rgba(255,255,255,0.04); }
  .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip-x { opacity: 0.5; font-size: 16px; line-height: 1; padding-left: 2px; }
  .controls {
    display: flex; gap: 8px; margin-bottom: 12px;
    flex-wrap: wrap; align-items: center;
  }
  .overlay-row {
    display: flex; gap: 16px; margin-bottom: 16px;
    flex-wrap: wrap; align-items: center;
    font-size: 12px; color: var(--text-dim);
  }
  .overlay-row label {
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
  }
  .overlay-row input[type="checkbox"] { cursor: pointer; }
  select, button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  select { min-width: 200px; }
  button:hover, select:hover { border-color: var(--text-dim); }
  button:disabled, select:disabled { opacity: 0.4; cursor: not-allowed; }
  .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    border: none; border-radius: 0; padding: 6px 12px; font-size: 12px;
    background: var(--bg); color: var(--text-dim);
  }
  .seg button.active { background: var(--border); color: var(--text); }
  .seg button + button { border-left: 1px solid var(--border); }
  .chart-wrap { position: relative; width: 100%; height: 380px; }
  .footnote { color: var(--text-faint); font-size: 12px; margin: 12px 0 0; }
  .loading { color: var(--text-dim); font-size: 14px; text-align: center; padding: 80px 0; }
  .error {
    color: #f85149; font-size: 14px; padding: 24px;
    border: 1px solid #f85149; border-radius: 6px;
    background: rgba(248, 81, 73, 0.08);
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Topic timeline</h1>
    <p class="sub">TheQuartering long-form uploads, by month, by primary topic</p>
  </header>

  <div class="panel">
    <div id="root"><div class="loading">Loading topic data…</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(async function() {
  const TQ_CHANNEL = 'UCfwE_ODI1YTbdjkzuSi1Nag';
  const DEFAULT_ACTIVE = ['trump', 'elon-musk', 'marvel-mcu', 'star-wars', 'fast-food-dining'];
  const MIN_TOPIC_TAGS = 5;

  // Group display config
  const GROUP_META = {
    politics: { name: 'Politics', color: '#dc2626' },
    media:    { name: 'Media',    color: '#0891b2' }
  };
  const DEFAULT_GROUP_ACTIVE = ['politics', 'media'];

  const root = document.getElementById('root');

  let data, topics, tagsFile;
  try {
    [data, topics, tagsFile] = await Promise.all([
      fetch('/data.json').then(r => r.json()),
      fetch('/topics.json').then(r => r.json()),
      fetch('/topic-tags.json').then(r => r.json())
    ]);
  } catch (e) {
    root.innerHTML = '<div class="error">Failed to load required files: ' + e.message + '</div>';
    return;
  }

  const cleanTopics = {};
  for (const [k, v] of Object.entries(topics)) {
    if (k.startsWith('_')) continue;
    if (!v || !v.name) continue;
    cleanTopics[k] = v;
  }
  const tags = tagsFile.tags || {};

  const tqVideos = data.videos.filter(v =>
    v.channelId === TQ_CHANNEL && !v.isShort && !v.unavailable
  );
  if (tqVideos.length === 0) {
    root.innerHTML = '<div class="error">No TQ long-form videos found.</div>';
    return;
  }

  // Build month list
  const monthIndex = (iso) => iso.slice(0, 7);
  const allMonths = new Set();
  for (const v of tqVideos) allMonths.add(monthIndex(v.publishedAt));
  const sortedMonths = [...allMonths].sort();
  function nextMonth(ym) {
    let [y, m] = ym.split('-').map(Number);
    m++; if (m > 12) { m = 1; y++; }
    return y + '-' + String(m).padStart(2, '0');
  }
  const months = [];
  let cur = sortedMonths[0];
  while (cur <= sortedMonths[sortedMonths.length - 1]) {
    months.push(cur); cur = nextMonth(cur);
  }
  const monthToIdx = new Map(months.map((m, i) => [m, i]));
  const N = months.length;

  // Aggregate per topic, per group, and overall monthly totals
  const monthVideoTotal = new Array(N).fill(0);
  const monthViewTotal = new Array(N).fill(0);
  const topicMonthlyVideos = {};
  const topicMonthlyViews = {};
  const groupMonthlyVideos = { politics: new Array(N).fill(0), media: new Array(N).fill(0) };
  const groupMonthlyViews = { politics: new Array(N).fill(0), media: new Array(N).fill(0) };
  for (const id of Object.keys(cleanTopics)) {
    topicMonthlyVideos[id] = new Array(N).fill(0);
    topicMonthlyViews[id] = new Array(N).fill(0);
  }
  const topicVideoCount = {};
  const topicTotalViews = {};
  for (const id of Object.keys(cleanTopics)) {
    topicVideoCount[id] = 0;
    topicTotalViews[id] = 0;
  }

  for (const v of tqVideos) {
    const idx = monthToIdx.get(monthIndex(v.publishedAt));
    if (idx === undefined) continue;
    const views = v.views || 0;
    monthVideoTotal[idx]++;
    monthViewTotal[idx] += views;
    const tag = tags[v.id];
    if (tag && topicMonthlyVideos[tag]) {
      topicMonthlyVideos[tag][idx]++;
      topicMonthlyViews[tag][idx] += views;
      topicVideoCount[tag]++;
      topicTotalViews[tag] += views;
      // Roll up into groups
      const group = cleanTopics[tag].group;
      if (group && groupMonthlyVideos[group]) {
        groupMonthlyVideos[group][idx]++;
        groupMonthlyViews[group][idx] += views;
      }
    }
  }

  // Per-topic catalogue
  const topicList = Object.entries(cleanTopics)
    .map(([id, t]) => ({
      id, name: t.name, color: t.color, group: t.group,
      count: topicVideoCount[id], views: topicTotalViews[id]
    }))
    .filter(t => t.count >= MIN_TOPIC_TAGS)
    .sort((a, b) => b.count - a.count);

  // Group totals (for chip labels)
  const groupTotals = {};
  for (const gid of Object.keys(GROUP_META)) {
    let count = 0, views = 0;
    for (const [tid, t] of Object.entries(cleanTopics)) {
      if (t.group === gid) {
        count += topicVideoCount[tid] || 0;
        views += topicTotalViews[tid] || 0;
      }
    }
    groupTotals[gid] = { count, views };
  }

  root.innerHTML = `
    <div class="toggles" id="toggles"></div>
    <div class="controls">
      <select id="add-select"><option value="">+ Add another topic…</option></select>
      <button id="reset-btn">Reset</button>
      <select id="mode-select">
        <option value="pct-videos">% of monthly uploads</option>
        <option value="pct-views">% of monthly views</option>
        <option value="count-views">Total views per month</option>
        <option value="count-videos">Videos per month</option>
      </select>
      <div class="seg" id="view-seg">
        <button data-view="individual" class="active">Individual</button>
        <button data-view="grouped">Grouped</button>
      </div>
    </div>
    <div class="overlay-row">
      <label>
        <input type="checkbox" id="overlay-views">
        Overlay total monthly channel views
      </label>
    </div>
    <div class="chart-wrap"><canvas id="chart"
      role="img"
      aria-label="Topic timeline line chart"></canvas></div>
    <p class="footnote">3-month rolling average. <span id="meta-stats"></span></p>
  `;

  // Stats footnote
  const tagged = Object.values(tags).length;
  const totalLF = tqVideos.length;
  const totalViews = tqVideos.reduce((s, v) => s + (v.views || 0), 0);
  const taggedViews = tqVideos
    .filter(v => tags[v.id])
    .reduce((s, v) => s + (v.views || 0), 0);
  document.getElementById('meta-stats').textContent =
    tagged.toLocaleString() + ' / ' + totalLF.toLocaleString() + ' videos tagged (' +
    ((tagged / totalLF) * 100).toFixed(1) + '%), representing ' +
    Math.round(taggedViews / 1000000) + 'M of ' +
    Math.round(totalViews / 1000000) + 'M total views.';

  // State
  let viewMode = 'individual';            // 'individual' | 'grouped'
  let active = new Set(DEFAULT_ACTIVE.filter(id => topicVideoCount[id] >= MIN_TOPIC_TAGS));
  let activeGroups = new Set(DEFAULT_GROUP_ACTIVE);
  let mode = 'pct-videos';
  let overlayViews = false;
  let chart;

  function rolling(arr, window) {
    const out = [];
    const half = Math.floor(window / 2);
    for (let i = 0; i < arr.length; i++) {
      let sum = 0, n = 0;
      for (let j = Math.max(0, i - half); j <= Math.min(arr.length - 1, i + half); j++) {
        sum += arr[j]; n++;
      }
      out.push(sum / n);
    }
    return out;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }
  function formatViews(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return Math.round(n).toString();
  }

  function buildDatasets() {
    const datasets = [];
    if (viewMode === 'grouped') {
      // Each active group as a line on primary axis
      for (const gid of Object.keys(GROUP_META)) {
        if (!activeGroups.has(gid)) continue;
        const g = GROUP_META[gid];
        const counts = groupMonthlyVideos[gid];
        const views = groupMonthlyViews[gid];
        let series;
        if (mode === 'pct-videos') {
          series = counts.map((c, i) => monthVideoTotal[i] > 0 ? (c / monthVideoTotal[i]) * 100 : 0);
        } else if (mode === 'pct-views') {
          series = views.map((c, i) => monthViewTotal[i] > 0 ? (c / monthViewTotal[i]) * 100 : 0);
        } else if (mode === 'count-views') {
          series = views;
        } else {
          series = counts;
        }
        datasets.push({
          label: g.name, data: rolling(series, 3),
          borderColor: g.color, backgroundColor: g.color + '20',
          borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, tension: 0.35,
          yAxisID: 'y'
        });
      }
    } else {
      for (const t of topicList.filter(t => active.has(t.id))) {
        const counts = topicMonthlyVideos[t.id];
        const views = topicMonthlyViews[t.id];
        let series;
        if (mode === 'pct-videos') {
          series = counts.map((c, i) => monthVideoTotal[i] > 0 ? (c / monthVideoTotal[i]) * 100 : 0);
        } else if (mode === 'pct-views') {
          series = views.map((c, i) => monthViewTotal[i] > 0 ? (c / monthViewTotal[i]) * 100 : 0);
        } else if (mode === 'count-views') {
          series = views;
        } else {
          series = counts;
        }
        datasets.push({
          label: t.name, data: rolling(series, 3),
          borderColor: t.color, backgroundColor: t.color + '20',
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: 0.35,
          yAxisID: 'y'
        });
      }
    }

    // Channel total views overlay on secondary axis
    if (overlayViews) {
      const series = rolling(monthViewTotal, 3);
      datasets.push({
        label: 'Channel total monthly views',
        data: series,
        borderColor: 'rgba(230, 237, 243, 0.45)',
        backgroundColor: 'transparent',
        borderWidth: 1.5,
        borderDash: [4, 4],
        pointRadius: 0,
        pointHoverRadius: 3,
        tension: 0.35,
        yAxisID: 'y1'
      });
    }

    return datasets;
  }

  function renderToggles() {
    const el = document.getElementById('toggles');
    el.innerHTML = '';
    if (viewMode === 'grouped') {
      for (const gid of Object.keys(GROUP_META)) {
        if (!activeGroups.has(gid)) continue;
        const g = GROUP_META[gid];
        const totals = groupTotals[gid];
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.style.background = g.color + '14';
        chip.style.border = '1px solid ' + g.color + '50';
        chip.innerHTML =
          '<span class="chip-dot" style="background:' + g.color + ';"></span>' +
          '<span>' + escapeHtml(g.name) + '</span>' +
          '<span style="color: var(--text-dim); font-size: 11px;">' + totals.count.toLocaleString() + ' videos</span>' +
          '<span class="chip-x">×</span>';
        chip.addEventListener('click', () => { activeGroups.delete(gid); render(); });
        el.appendChild(chip);
      }
    } else {
      for (const t of topicList.filter(t => active.has(t.id))) {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.style.background = t.color + '14';
        chip.style.border = '1px solid ' + t.color + '50';
        chip.innerHTML =
          '<span class="chip-dot" style="background:' + t.color + ';"></span>' +
          '<span>' + escapeHtml(t.name) + '</span>' +
          '<span class="chip-x">×</span>';
        chip.addEventListener('click', () => { active.delete(t.id); render(); });
        el.appendChild(chip);
      }
    }
  }

  function renderAddSelect() {
    const sel = document.getElementById('add-select');
    sel.innerHTML = '';
    if (viewMode === 'grouped') {
      sel.disabled = true;
      sel.innerHTML = '<option value="">— group view —</option>';
      // Allow re-adding any group that's been removed
      const inactive = Object.keys(GROUP_META).filter(g => !activeGroups.has(g));
      if (inactive.length > 0) {
        sel.disabled = false;
        sel.innerHTML = '<option value="">+ Add group…</option>';
        for (const gid of inactive) {
          const opt = document.createElement('option');
          opt.value = 'group:' + gid;
          opt.textContent = GROUP_META[gid].name;
          sel.appendChild(opt);
        }
      }
    } else {
      sel.disabled = false;
      sel.innerHTML = '<option value="">+ Add another topic…</option>';
      for (const t of topicList.filter(t => !active.has(t.id))) {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.name + ' (' + t.count + ' videos, ' + formatViews(t.views) + ' views)';
        sel.appendChild(opt);
      }
    }
  }

  function getYAxisTitle() {
    if (mode === 'pct-videos') return 'Share of monthly uploads (%)';
    if (mode === 'pct-views') return 'Share of monthly views (%)';
    if (mode === 'count-views') return 'Views per month';
    return 'Videos per month';
  }

  function formatYTick(v) {
    if (mode === 'count-views') return formatViews(v);
    if (mode.startsWith('pct')) return v + '%';
    return Math.round(v);
  }

  function render() {
    renderToggles();
    renderAddSelect();
    if (chart) {
      chart.data.datasets = buildDatasets();
      chart.options.scales.y.title.text = getYAxisTitle();
      chart.options.scales.y.ticks.callback = formatYTick;
      chart.options.scales.y1.display = overlayViews;
      chart.update();
    }
  }

  // Wire controls
  document.getElementById('add-select').addEventListener('change', (e) => {
    if (!e.target.value) return;
    if (viewMode === 'grouped' && e.target.value.startsWith('group:')) {
      activeGroups.add(e.target.value.slice('group:'.length));
    } else {
      active.add(e.target.value);
    }
    render();
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (viewMode === 'grouped') {
      activeGroups = new Set(DEFAULT_GROUP_ACTIVE);
    } else {
      active = new Set(DEFAULT_ACTIVE.filter(id => topicVideoCount[id] >= MIN_TOPIC_TAGS));
    }
    render();
  });
  document.getElementById('mode-select').addEventListener('change', (e) => {
    mode = e.target.value;
    render();
  });
  document.getElementById('view-seg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    document.querySelectorAll('#view-seg button').forEach(b => b.classList.toggle('active', b === btn));
    viewMode = btn.dataset.view;
    render();
  });
  document.getElementById('overlay-views').addEventListener('change', (e) => {
    overlayViews = e.target.checked;
    render();
  });

  // Chart init
  const tickColor = 'rgba(230, 237, 243, 0.55)';
  const gridColor = 'rgba(255, 255, 255, 0.06)';
  const xLabels = months.map(m => m.endsWith('-01') ? m.slice(0, 4) : '');

  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: months, datasets: buildDatasets() },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(13, 17, 23, 0.95)',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#e6edf3',
          padding: 10,
          callbacks: {
            title: (items) => items[0].label,
            label: (item) => {
              const v = item.parsed.y;
              const isOverlay = item.dataset.yAxisID === 'y1';
              if (isOverlay) return item.dataset.label + ': ' + formatViews(v) + ' views';
              if (mode === 'pct-videos' || mode === 'pct-views') {
                return item.dataset.label + ': ' + v.toFixed(1) + '%';
              }
              if (mode === 'count-views') {
                return item.dataset.label + ': ' + formatViews(v) + ' views';
              }
              return item.dataset.label + ': ' + v.toFixed(1) + ' videos';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color: tickColor, autoSkip: false, maxRotation: 0,
            callback: (val, idx) => xLabels[idx]
          },
          grid: { color: gridColor }
        },
        y: {
          beginAtZero: true,
          position: 'left',
          title: { display: true, text: getYAxisTitle(), color: tickColor, font: { size: 12 } },
          ticks: { color: tickColor, callback: formatYTick },
          grid: { color: gridColor }
        },
        y1: {
          beginAtZero: true,
          position: 'right',
          display: false,
          title: { display: true, text: 'Monthly channel views', color: 'rgba(230, 237, 243, 0.45)', font: { size: 12 } },
          ticks: { color: 'rgba(230, 237, 243, 0.45)', callback: (v) => formatViews(v) },
          grid: { drawOnChartArea: false }
        }
      }
    }
  });

  render();
})();
</script>

</body>
</html>
