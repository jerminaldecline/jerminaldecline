<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quartering Network — Monthly Report</title>
<style>
:root{
  color-scheme: light dark;
  --brand:#6aa3ff;--bg:#0d1220;--surface:#161c2e;--surface-2:#1d2538;--border:#29314a;
  --text:#ede8d8;--text-muted:#9aa0b3;--text-dim:#6c728a;--accent:var(--brand);
  --up:#4dd0a0;--down:#ff6b66;--label:#b9c0d0;--subtext:#8b93a8;
  --up-bg:rgba(77,208,160,0.15);--down-bg:rgba(255,107,102,0.15);--flat-bg:rgba(108,114,138,0.14);
}
@media (prefers-color-scheme: light){
  :root{
    --brand:#1b4d9f;--bg:#f6f3ec;--surface:#ffffff;--surface-2:#efebe1;--border:#e3ddd0;
    --text:#1c1a14;--text-muted:#6b665a;--text-dim:#998f7c;--accent:var(--brand);
    --up:#1d9e75;--down:#b8302b;--label:#534e44;--subtext:#736d5f;
    --up-bg:rgba(29,158,117,0.13);--down-bg:rgba(184,48,43,0.11);--flat-bg:rgba(153,143,124,0.14);
  }
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:28px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto}





.report{background:var(--bg);border-radius:16px}
.brand{display:flex;align-items:center;gap:0.7rem;margin-bottom:1.15rem}
.brand-logo{width:40px;height:40px;flex:0 0 40px}
.brand-text .bn{font-size:1.18rem;font-weight:800;letter-spacing:-0.01em;line-height:1.1}
.brand-text .bd{font-size:0.8rem;color:var(--subtext)}
.report-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;padding-bottom:0.95rem;border-bottom:2px solid var(--accent)}
.report-head h2{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-0.02em}
.report-head .rsub{margin:0.15rem 0 0;color:var(--subtext);font-size:0.88rem}
.rsub-row{display:flex;align-items:center;gap:0.5rem;margin-top:0.3rem;flex-wrap:wrap}
.rsub-sep{color:var(--text-dim)}
.scope-inline{background:var(--surface-2);color:var(--accent);border:1px solid var(--border);border-radius:8px;padding:0.25rem 0.5rem;font-size:0.92rem;font-weight:700;cursor:pointer;font-family:inherit}
.scope-inline:hover{border-color:var(--accent)}
.scope-inline option,.month-inline option{background:var(--surface);color:var(--text)}
.report-month-wrap{display:flex;align-items:center}
.month-inline{font-size:1.05rem;font-weight:800;color:var(--accent);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:0.35rem 0.55rem;cursor:pointer;font-family:inherit;text-align:left}
.month-inline:hover{border-color:var(--accent)}

.peak-headline{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.peak-item .peak-label{font-size:0.74rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--label);margin-bottom:0.3rem}
.peak-item .peak-val{font-size:0.92rem;color:var(--subtext)}
.peak-item .peak-num{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;color:var(--text);margin-right:0.3rem}
.peak-item .peak-delta{color:var(--down);font-weight:700;font-size:0.85rem;margin-left:0.3rem;white-space:nowrap}
.peak-item .peak-sub{font-size:0.82rem;color:var(--text-dim);margin-top:0.2rem;font-weight:600}
@media(max-width:680px){.peak-headline{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.3rem 1.45rem}
.hero-label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--label);margin-bottom:0.5rem}
.hero-num{font-size:2.5rem;font-weight:800;letter-spacing:-0.025em;line-height:1}
.hero-sub{font-size:0.85rem;color:var(--subtext);margin-top:0.35rem}
.deltas{display:flex;gap:0.6rem;margin-top:0.95rem;padding-top:0.8rem;border-top:1px solid var(--border)}
.pill{display:inline-flex;align-items:center;gap:0.35rem;padding:0.3rem 0.65rem;border-radius:8px;font-size:0.82rem;background:var(--surface-2)}
.pill .pl{color:var(--subtext);font-size:0.78rem}
.pill .pv{font-weight:700}
.pill.up .pv{color:var(--up)}.pill.down .pv{color:var(--down)}.pill.flat .pv{color:var(--text-dim)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;margin-bottom:1rem;align-items:stretch}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:0.15rem}
.stat-num{font-size:1.55rem;font-weight:800;letter-spacing:-0.01em;line-height:1.05}
.stat-lbl{font-size:0.74rem;color:var(--label);text-transform:uppercase;letter-spacing:0.04em;margin-top:0.1rem}
.stat-deltas{display:flex;gap:0.5rem;margin-top:0.6rem}
.mini{font-size:0.78rem;display:inline-flex;align-items:center;gap:0.3rem}
.mini .ml{color:var(--subtext)}
.mini .mv{font-weight:700}
.mini.up .mv{color:var(--up)}.mini.down .mv{color:var(--down)}.mini.flat .mv{color:var(--text-dim)}

.highlights{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem;align-items:stretch}
.hl{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.95rem 1.15rem;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:0.7rem}
.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.hl.debate::before{background:var(--down)}
.hl-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--label);margin-bottom:0.4rem;font-weight:700}
.hl-title{display:inline;font-size:0.95rem;font-weight:700;line-height:1.3;margin-bottom:0.35rem;color:var(--text);text-decoration:none}

.link-icon{display:inline-block;vertical-align:-1px;margin-left:0.3rem;color:var(--accent)}
.hl-note{font-size:0.78rem;color:var(--subtext);line-height:1.4}
.hl-ch{font-size:0.72rem;color:var(--text-dim);margin-top:0.15rem}
.hl-stats{display:flex;gap:1.75rem;flex-wrap:wrap;padding-top:0.8rem;border-top:1px solid var(--border)}
.hl-stat{display:flex;flex-direction:column;gap:0.1rem}
.hl-stat .hsv{font-size:1.05rem;font-weight:800;color:var(--text);line-height:1.1}
.hl-stat .hsl{font-size:0.7rem;color:var(--subtext);text-transform:uppercase;letter-spacing:0.04em}

.lower{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.4rem}
.panel h3{margin:0 0 1rem;font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--label)}
.toplist{list-style:none;margin:0;padding:0;font-size:0.87rem;display:flex;flex-direction:column;gap:0.65rem}
.toplist li .row{display:flex;justify-content:space-between;margin-bottom:0.3rem}
.toplist .cnt{color:var(--subtext);font-size:0.8rem}
.toplist .tbar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.toplist .tbar span{display:block;height:100%;background:var(--accent);border-radius:4px;opacity:0.6}
.toplist li:first-child .tbar{height:9px}
.toplist li:first-child .tbar span{opacity:1}
.toplist li:first-child .row span:first-child{font-weight:700}
.toplist .empty{color:var(--text-dim);font-size:0.82rem}
.cmp-table{width:100%;border-collapse:collapse;font-size:0.86rem}
.cmp-table th{text-align:right;font-size:0.74rem;color:var(--label);font-weight:700;padding:0.4rem 0.4rem;border-bottom:1px solid var(--border)}
.cmp-table th:first-child{text-align:left}
.cmp-table td{text-align:right;padding:0.5rem 0.4rem;border-bottom:1px solid var(--border)}
.cmp-table td:first-child{text-align:left;color:var(--label)}
.cmp-table tr:last-child td{border-bottom:none}
.cmp-table .now{color:var(--text);font-weight:700}

.section-divider{display:flex;align-items:center;gap:0.9rem;margin:1.6rem 0 1rem;color:var(--label);font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
.section-divider::before,.section-divider::after{content:"";height:1px;background:var(--border);flex:1}
.breadth{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:0.5rem;margin-top:1rem}
.shorts-strip{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.35rem;display:flex;flex-direction:column;justify-content:flex-start;gap:1.3rem;border-left:3px solid var(--text-dim)}
.shorts-label{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--label);font-weight:700;margin-bottom:0.3rem}
.shorts-sub{font-size:0.78rem;color:var(--subtext);line-height:1.45}
.shorts-nums{display:flex;gap:2.5rem}
.shorts-stat{display:flex;flex-direction:column;gap:0.2rem}
.shorts-stat .ss-num{font-size:2rem;font-weight:800;letter-spacing:-0.02em;color:var(--text);line-height:1}
.shorts-stat .ss-lbl{font-size:0.72rem;color:var(--subtext);text-transform:uppercase;letter-spacing:0.04em}
.best-short{margin-top:0.2rem;padding-top:1rem;border-top:1px solid var(--border)}

.best-short .bs-title{display:inline;font-size:0.9rem;font-weight:700;line-height:1.3;color:var(--text);text-decoration:none}
.best-short .bs-title:hover{color:var(--accent);text-decoration:underline}
.best-short .bs-meta{font-size:0.78rem;color:var(--subtext);margin-top:0.35rem}
.best-short .bs-meta b{color:var(--text-muted);font-weight:700}
.net-panel h3{margin:0 0 0.85rem}
.net-table{width:100%;border-collapse:collapse;font-size:0.84rem}
.net-table th{font-size:0.68rem;color:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:0.25rem 0.35rem}
.net-table .net-ch-h{text-align:left;vertical-align:bottom;padding-bottom:0.5rem}
.net-table .net-grp{text-align:center;border-bottom:1px solid var(--border);padding-bottom:0.3rem}
.net-table .net-grp-s{border-left:1px solid var(--border)}
.net-table .net-sub{text-align:right;color:var(--subtext);font-size:0.62rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
.net-table .net-sub.divcol{border-left:1px solid var(--border)}
.net-table td{text-align:right;padding:0.45rem 0.35rem;border-bottom:1px solid var(--border)}
.net-table td:first-child{text-align:left}
.net-table td.divcol{border-left:1px solid var(--border)}
.net-table tr:last-child td{border-bottom:none}
.net-table tr.active td{color:var(--text)}
.net-ch{color:var(--text);font-weight:600}
.net-ch.dim{color:var(--text-dim);font-weight:500}

.report-foot{margin-top:1.2rem;padding-top:0.95rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
/* ---- month detail (bottom of report) ---- */
.month-detail{margin-top:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.4rem}
.md-head{display:flex;align-items:center;gap:2rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--border);margin-bottom:1rem}
.md-month{font-size:1.15rem;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.md-progress{font-size:0.65rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:0.15rem 0.6rem;margin-left:0.5rem;text-transform:uppercase;letter-spacing:0.05em;vertical-align:middle}
.md-head-stats{display:flex;gap:2rem;flex-wrap:wrap;flex:1}
.md-hstat .md-hnum{font-size:1.2rem;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.md-hstat .md-slash{color:var(--text-dim);font-weight:600}
.md-hstat .md-hlbl{font-size:0.72rem;color:var(--subtext);text-transform:uppercase;letter-spacing:0.03em;margin-top:0.15rem}
.md-hsplit{min-width:200px}
.md-splitbar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin:0.35rem 0}
.md-split-long{background:var(--accent)} .md-split-short{background:#e0a23c}
.md-ribbon{margin-bottom:1rem}
.md-ribbon-legend{display:flex;flex-wrap:wrap;gap:0.5rem 1.1rem;font-size:0.76rem;color:var(--subtext)}
.md-leg{display:inline-flex;align-items:center;gap:0.35rem}
.md-leg-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0.7}
.md-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.85rem;color:var(--text);font-family:inherit;font-size:0.9rem;margin-bottom:0.5rem}
.md-group-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:0.75rem 0 0.5rem}
.md-group-label{font-size:0.92rem;font-weight:700;color:var(--text)}
.md-group-meta{font-size:0.78rem;color:var(--subtext);font-variant-numeric:tabular-nums}
.md-rows{display:flex;flex-direction:column}
.md-row{display:grid;grid-template-columns:1fr 80px 110px 90px 70px 150px;gap:0.75rem;padding:0.5rem 0.4rem;align-items:center;border-bottom:1px solid var(--border);font-size:0.84rem}
.md-row.md-with-ch{grid-template-columns:1fr 110px 80px 110px 90px 70px 150px}
.md-row-head{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--label);font-weight:700}
.md-row:last-child{border-bottom:none}
.md-row:not(.md-row-head):hover{background:var(--surface-2)}
.md-c-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.md-c-dur,.md-c-views,.md-c-comm,.md-c-like{text-align:right;font-variant-numeric:tabular-nums}
.md-c-views{font-weight:700;color:var(--text)}
.md-c-dur,.md-c-comm,.md-c-like{color:var(--text-muted)}
.md-c-ch,.md-c-topic{color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-topic-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0.7;margin-right:0.4rem;vertical-align:middle}
.md-sortable{cursor:pointer;user-select:none}
.md-sortable:hover{color:var(--accent)}

.report-foot .site{font-size:0.88rem;font-weight:800;color:var(--accent);letter-spacing:-0.01em}
@media(max-width:680px){.hero,.lower,.highlights,.breadth{grid-template-columns:1fr}.stat-row{grid-template-columns:repeat(2,1fr)}}
</style>

<body>
<div class="wrap">
  <div class="report" id="report"><div style="padding:3rem;text-align:center;color:var(--subtext)">Loading…</div></div>
</div>
<script>
/* ---------- data layer: fetch live JSON, compute per-scope/per-month ---------- */
const RPM = { l8:[0.85,1.28], l38:[0.50,1.00], sub3:[0.30,0.60] };
function rpmFor(d){ if(d>=480) return RPM.l8; if(d>=180) return RPM.l38; return RPM.sub3; }
const CHAN_ORDER = ['@TheQuartering','@JeremyHambly','@QuarteringLive','@rcnightmare','@UnSleevedMedia'];
const MIN_MONTH = '2017-07';
function ym(v){ return v.publishedAt.slice(0,7); }
function median(arr){ if(!arr.length) return 0; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }

let PAYLOAD = null; // {scopes, net, channels}

async function loadAndCompute(){
  const bust = '?t='+Date.now();
  const [dataRes, tagsRes, topicsRes] = await Promise.all([
    fetch('data.json'+bust), fetch('topic-tags.json'+bust), fetch('topics.json'+bust)
  ]);
  const data = await dataRes.json();
  const tagsRaw = await tagsRes.json(); const tags = tagsRaw.tags || {};
  const topicsRaw = await topicsRes.json();
  const tname = {}; for(const [k,v] of Object.entries(topicsRaw)){ if(!k.startsWith('_') && v && v.name) tname[k]=v.name; }
  const handle = {}; for(const [cid,c] of Object.entries(data.channels||{})) handle[cid]=c.handle||cid;
  const hid = {}; for(const [cid,h] of Object.entries(handle)) hid[h]=cid;
  const vids = data.videos || [];

  function vstats(v){ return {title:v.title, views:v.views||0, comments:v.comments||0, likes:v.likes||0, id:v.id, ch:handle[v.channelId]||'?'}; }

  function buildScope(filterFn){
    const bym={}, shby={};
    for(const v of vids){
      if(!filterFn(v)) continue;
      const m=ym(v);
      if(v.isShort){ (shby[m]=shby[m]||[]).push(v); } else { (bym[m]=bym[m]||[]).push(v); }
    }
    const out={}; const months=new Set([...Object.keys(bym),...Object.keys(shby)]);
    for(const m of months){
      const vs=bym[m]||[]; const sh=shby[m]||[];
      const shorts={n:sh.length, v:sh.reduce((s,x)=>s+(x.views||0),0), best:null};
      if(sh.length){ const b=[...sh].sort((a,b)=>(b.views||0)-(a.views||0))[0]; shorts.best=vstats(b); }
      if(!vs.length){ out[m]={shortsOnly:true, shorts}; continue; }
      const views=vs.map(v=>v.views||0);
      const lvs=vs.filter(v=>v.views>0&&v.likes!=null).map(v=>v.likes/v.views);
      const crs=vs.filter(v=>v.views>0&&v.comments!=null).map(v=>v.comments/v.views);
      const medCr=median(crs);
      const durs=vs.filter(v=>v.durationSec).map(v=>v.durationSec);
      const tc={}; for(const v of vs){ const t=tags[v.id]; if(t) tc[t]=(tc[t]||0)+1; }
      // Lean per-video records for the month-detail list (long-form + shorts).
      // Only the fields the detail view needs, to keep the payload reasonable.
      const leanVid = v => ({
        id:v.id, t:v.title, v:v.views||0, l:v.likes||0, c:v.comments||0,
        d:v.durationSec||0, s:!!v.isShort,
        tp: tags[v.id] ? (tname[tags[v.id]]||tags[v.id]) : null,
        ch: handle[v.channelId]||'?'
      });
      const vlist = [...vs, ...sh].map(leanVid);
      const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,n])=>[tname[t]||t,n]);
      const topvid=vstats([...vs].sort((a,b)=>(b.views||0)-(a.views||0))[0]);
      const cand=vs.filter(v=>(v.views||0)>=3000 && v.comments).map(v=>[v.comments/v.views,v]).sort((a,b)=>b[0]-a[0]);
      let debate=null;
      if(cand.length){ const [r,dv]=cand[0]; debate=vstats(dv); debate.crate=Math.round(r*1000)/10; debate.mult=medCr>0?Math.round(r/medCr*10)/10:null; }
      out[m]={
        n:vs.length, tot:views.reduce((a,b)=>a+b,0), med:Math.round(median(views)),
        lv: lvs.length?Math.round(median(lvs)*1000)/10:0,
        comments: vs.reduce((s,v)=>s+(v.comments||0),0),
        avglen: durs.length?Math.round(median(durs)/60*10)/10:0,
        runtime: durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/3600*10)/10:0,
        revlo: Math.round(vs.reduce((s,v)=>s+(v.views/1000)*rpmFor(v.durationSec||600)[0],0)),
        revhi: Math.round(vs.reduce((s,v)=>s+(v.views/1000)*rpmFor(v.durationSec||600)[1],0)),
        top, topvid, debate, shorts, vlist
      };
    }
    return out;
  }

  const scopes={ ALL: buildScope(()=>true) };
  for(const h of CHAN_ORDER){ const cid=hid[h]; if(cid) scopes[h]=buildScope(v=>v.channelId===cid); }

  // network breakdown per month (all-channel)
  const netbm={};
  for(const v of vids){
    const m=ym(v), h=handle[v.channelId]||'?';
    (netbm[m]=netbm[m]||{});
    (netbm[m][h]=netbm[m][h]||{ln:0,lv:0,sn:0,sv:0});
    if(v.isShort){ netbm[m][h].sn++; netbm[m][h].sv+=v.views||0; } else { netbm[m][h].ln++; netbm[m][h].lv+=v.views||0; }
  }
  const net={};
  for(const m of Object.keys(netbm)){
    const rows=[];
    for(const h of CHAN_ORDER){ const d=netbm[m][h]; if(d && (d.ln+d.sn)>0) rows.push({h, ln:d.ln, lv:d.lv, sn:d.sn, sv:d.sv}); }
    net[m]=rows;
  }

  // Per-scope peak + lowest-since-peak (long-form monthly totals; exclude the
  // current in-progress month so a partial month can't masquerade as a low).
  const nowMonth = new Date().toISOString().slice(0,7);
  const peaks={};
  for(const sc of Object.keys(scopes)){
    const S=scopes[sc];
    const ms=Object.keys(S).filter(m=>m>=MIN_MONTH && m<nowMonth && !S[m].shortsOnly && S[m].tot!=null).sort();
    if(!ms.length){ peaks[sc]=null; continue; }
    let pk=ms[0]; for(const m of ms){ if(S[m].tot>S[pk].tot) pk=m; }
    const after=ms.filter(m=>m>pk);
    let low=pk; for(const m of after){ if(S[m].tot<S[low].tot) low=m; }
    // "Last seen at this level": the most recent month BEFORE the peak whose
    // long-form views were at or below the current low — i.e. the channel has
    // fallen back to where it was then. Null if it was never this low pre-peak.
    let lastSeen=null;
    const beforePeak=ms.filter(m=>m<pk);
    for(let i=beforePeak.length-1;i>=0;i--){ if(S[beforePeak[i]].tot<=S[low].tot){ lastSeen=beforePeak[i]; break; } }
    peaks[sc]={ peakMonth:pk, peakViews:S[pk].tot, lowMonth:low, lowViews:S[low].tot,
      pctFromPeak: S[pk].tot>0 ? Math.round((S[low].tot-S[pk].tot)/S[pk].tot*100) : 0,
      lastSeenMonth:lastSeen };
  }

  return { scopes, net, channels: CHAN_ORDER, peaks };
}

let SCOPES, NET, CHANNELS, PEAKS;
const fmt = n => n>=1000000 ? (n/1000000).toFixed(1)+'M' : n>=1000 ? (n/1000).toFixed(0)+'K' : ''+n;

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthName = m => {const [y,mo]=m.split('-');return MONTHS[mo-1]+' '+y;};
const yearsAgoStr = m => {
  const [y,mo]=m.split('-').map(Number);
  const then=new Date(y,mo-1,1), now=new Date();
  const months=(now.getFullYear()-then.getFullYear())*12+(now.getMonth()-then.getMonth());
  if(months<1) return 'this month';
  if(months<12) return '≈ '+months+(months===1?' month':' months')+' ago';
  const yrs=Math.round(months/12);
  return '≈ '+yrs+(yrs===1?' year':' years')+' ago';
};
const monthShort = m => {const [y,mo]=m.split('-');return MONTHS[mo-1].slice(0,3)+' '+y;};
const moAbbr = mm => {const [y,mo]=mm.split('-');return 'vs '+MONTHS[mo-1].slice(0,3);};
const moAbbrYr = mm => {const [y,mo]=mm.split('-');return "vs "+MONTHS[mo-1].slice(0,3)+" '"+y.slice(2);};
const prevMonth = m => {const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-2);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const yoyMonth = m => {const [y,mo]=m.split('-');return (y-1)+'-'+mo;};

function dcls(cur,prev,goodUp){ if(prev==null||prev===0||cur==null) return null; const d=Math.round((cur-prev)/prev*100);
  if(d===0) return {cls:'flat',txt:'▬ 0%'}; const pos=d>0; const arrow=(pos?'▲':'▼')+' '+Math.abs(d)+'%';
  if(goodUp===null) return {cls:'flat',txt:arrow}; const good=goodUp?pos:!pos;
  return {cls:good?'up':'down',txt:arrow}; }
function pill(label,cur,prev,goodUp){ const d=dcls(cur,prev,goodUp);
  if(!d) return '<span class="pill flat"><span class="pl">'+label+'</span><span class="pv">—</span></span>';
  return '<span class="pill '+d.cls+'"><span class="pl">'+label+'</span><span class="pv">'+d.txt+'</span></span>'; }
function mini(label,cur,prev,goodUp){ const d=dcls(cur,prev,goodUp); if(!d) return '';
  return '<span class="mini '+d.cls+'"><span class="ml">'+label+'</span><span class="mv">'+d.txt+'</span></span>'; }

const mdState = { query:'', sortBy:'views', sortDir:'desc', format:'long' };
const fmtDur = sec => { sec=Math.round(sec||0); const h=Math.floor(sec/3600), mm=Math.floor((sec%3600)/60), ss=sec%60; return (h>0?h+':'+String(mm).padStart(2,'0'):mm)+':'+String(ss).padStart(2,'0'); };
function mdSortArrow(col){ return mdState.sortBy===col ? (mdState.sortDir==='asc'?' ▲':' ▼') : ''; }
function mdSortVids(list){
  const s=list.slice().sort((a,b)=>{

    return mdState.sortDir==='asc'?c:-c;
  });
  return s;
}

  }
  function bindDetail(){
    const search=document.getElementById('mdSearch');
    if(search){ search.oninput=(e)=>{ mdState.query=e.target.value; const pos=e.target.selectionStart; rerenderDetail(); const ni=document.getElementById('mdSearch'); if(ni){ni.focus(); ni.setSelectionRange(pos,pos);} }; }
    document.querySelectorAll('.month-detail [data-md-format]').forEach(b=>{
      b.onclick=()=>{ mdState.format=b.dataset.mdFormat; rerenderDetail(); };
    });
    document.querySelectorAll('.month-detail .md-sortable').forEach(h=>{
      h.onclick=()=>{ const col=h.dataset.mdSort;
        if(mdState.sortBy===col){ mdState.sortDir=mdState.sortDir==='asc'?'desc':'asc'; }
        else { mdState.sortBy=col; mdState.sortDir='desc'; }
        rerenderDetail(); };
    });
  }
  bindDetail();
}
let CURRENT_MONTH=null;

function refresh(month){
  const months=availableMonths();
  const sel = months.includes(month) ? month : months[0];
  render(sel);
  const u=new URL(location); u.searchParams.set('view',scope); u.searchParams.set('month',sel); history.replaceState(null,'',u);
}

// async bootstrap: load live data, compute, then render
(async function init(){
  try {
    PAYLOAD = await loadAndCompute();
    SCOPES = PAYLOAD.scopes; NET = PAYLOAD.net; CHANNELS = PAYLOAD.channels; PEAKS = PAYLOAD.peaks;
    buildScopeLabels();
    const params=new URLSearchParams(location.search);
    const qv=params.get('view'); if(qv && (qv==='ALL'||CHANNELS.includes(qv))){ scope=qv; }
    const qm=params.get('month');
    // default to the latest available month in scope (not a hardcoded date)
    const months = availableMonths();
    const startMonth = (qm && SCOPES[scope][qm] && !SCOPES[scope][qm].shortsOnly) ? qm : months[0];
    refresh(startMonth);
  } catch(err){
    document.getElementById('report').innerHTML =
      '<div style="padding:3rem;text-align:center;color:var(--down)">Could not load report data. '
      + 'Please refresh.</div>';
    console.error('Monthly report load failed:', err);
  }
})();

</script>
