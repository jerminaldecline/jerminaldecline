// Pick a "nice" max for Y axis — round up to a clean multiple
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let factor;
  if (norm <= 1) factor = 1;
  else if (norm <= 1.5) factor = 1.5;
  else if (norm <= 2) factor = 2;
  else if (norm <= 2.5) factor = 2.5;
  else if (norm <= 3) factor = 3;
  else if (norm <= 4) factor = 4;
  else if (norm <= 5) factor = 5;
  else if (norm <= 7.5) factor = 7.5;
  else factor = 10;
  return factor * mag;
}

// Tighter version of niceMax with more factor granularity. Use this when
// you want the peak data to fill more of the chart height — fewer cases
// where the value sits awkwardly far below the rounded axis maximum.
// Worst-case overshoot is ~10% (peak at 0.9× yMax) vs ~33% for niceMax.
// Returns { max, step } so the caller can pick clean tick values.
function tightNiceAxis(v) {
  if (v <= 0) return { max: 1, step: 0.2 };
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  // Each factor gets a tick step chosen so axis labels land on clean values
  const choices = [
    { factor: 1,   step: 0.2 },
    { factor: 1.2, step: 0.2 },
    { factor: 1.5, step: 0.25 },
    { factor: 1.8, step: 0.3 },
    { factor: 2,   step: 0.5 },
    { factor: 2.5, step: 0.5 },
    { factor: 3,   step: 0.5 },
    { factor: 3.5, step: 0.5 },
    { factor: 4,   step: 1 },
    { factor: 5,   step: 1 },
    { factor: 6,   step: 1 },
    { factor: 7.5, step: 1.5 },
    { factor: 9,   step: 1.5 },
    { factor: 10,  step: 2 }
  ];
  for (const c of choices) {
    if (norm <= c.factor) {
      return { max: c.factor * mag, step: c.step * mag };
    }
  }
  return { max: 10 * mag, step: 2 * mag };
}

// Pick a "nice" tick range for a duration axis: returns { min, max, step } in seconds,
// where min/max are multiples of step, and step is chosen so the axis has 4-8 ticks
// at human-readable intervals (30s, 1m, 2m, 5m, 10m, etc).
// Inputs minSec and maxSec define the observed data range; the returned bounds
// extend outward to clean multiples of the chosen step.
function niceDurationAxis(minSec, maxSec) {
  const span = Math.max(1, maxSec - minSec);
  // Candidate step sizes in seconds, in order of preference
  // (60, 120, 180, 300, 600... and finer at the small end for very tight ranges)
  const candidateSteps = [30, 60, 90, 120, 180, 300, 600, 900, 1800, 3600];
  // Find a step that yields a comfortable 4-8 tick spread
  let step = candidateSteps[0];
  for (const s of candidateSteps) {
    const ticks = Math.ceil(maxSec / s) - Math.floor(minSec / s) + 1;
    if (ticks <= 8) { step = s; break; }
  }
  // Round outward to clean multiples
  const niceMin = Math.max(0, Math.floor(minSec / step) * step);
  const niceMax = Math.ceil(maxSec / step) * step;
  return { min: niceMin, max: niceMax, step };
}

  function extractWords(videos) {
  const counts = new Map();
  for (const v of videos) {
    if (!v.title || v.unavailable) continue;
    // Find tokens: words (possibly with apostrophes) and hashtags
    const tokens = v.title.match(/#[\w]+|[A-Za-z][A-Za-z']*/g) || [];
    for (let tok of tokens) {
      // Normalise: lowercase, strip apostrophes from words (but keep hashtags as-is in case)
      let key;
      if (tok.startsWith('#')) {
        key = tok.toLowerCase();
      } else {
        key = tok.toLowerCase().replace(/'/g, '');
      }
      if (key.length < 3) continue;
      if (STOPWORDS.has(key)) continue;
      counts.set(key, (counts.get(key) || 0) + 1);
    }
  }
  return counts;
}

  function computeAnalyticsBaselines(){
    const m = new Map();
    if (!ANALYTICS_DATASET?.videos) return m;
    const now = Date.now(); const minAgeMs = 3 * 86400 * 1000;
    const byChannel = new Map();
    for (const v of ANALYTICS_DATASET.videos) {
      if (v.isShort || v.unavailable) continue;
      const views = v.views || 0, likes = v.likes || 0;
      if (views < 1000 || likes <= 0) continue;
      if (now - new Date(v.publishedAt).getTime() < minAgeMs) continue;
      if (!byChannel.has(v.channelId)) byChannel.set(v.channelId, []);
      byChannel.get(v.channelId).push(likes / views);
    }
    for (const [cid, rates] of byChannel.entries()) {
      if (rates.length < 30) continue;
      rates.sort((a,b)=>a-b);
      m.set(cid, { p10: rates[Math.floor(rates.length*0.1)], p90: rates[Math.floor(rates.length*0.9)], median: rates[Math.floor(rates.length*0.5)], n: rates.length });
    }
    return m;
  }

  function fmtUSD(amount, compact = false) {
  amount = Math.max(0, amount);
  if (compact && amount >= 1000) {
    if (amount >= 1e6) return '$' + (amount / 1e6).toFixed(amount >= 1e7 ? 0 : 1) + 'M';
    return '$' + (amount / 1000).toFixed(amount >= 10000 ? 0 : 1) + 'k';
  }
  return '$' + Math.round(amount).toLocaleString('en-US');
}
  function summariseRevenue(videos) {
  const buckets = {
    longFormMidRoll: { views: 0, count: 0 },
    longFormShort: { views: 0, count: 0 },
    shorts: { views: 0, count: 0 }
  };
  for (const v of videos) {
    if (v.unavailable) continue;
    const views = v.views || 0;
    if (!views) continue;
    if (v.isShort) {
      buckets.shorts.views += views;
      buckets.shorts.count++;
    } else if ((v.durationSec || 0) >= AN_MID_ROLL_THRESHOLD_SEC) {
      buckets.longFormMidRoll.views += views;
      buckets.longFormMidRoll.count++;
    } else {
      buckets.longFormShort.views += views;
      buckets.longFormShort.count++;
    }
  }
  function bucketRevenue(b, rpm, rpmPess) {
    return {
      ...b,
      low: (b.views / 1000) * rpm.low,
      high: (b.views / 1000) * rpm.high,
      pessLow: (b.views / 1000) * rpmPess.low,
      pessHigh: (b.views / 1000) * rpmPess.high,
      rpmLow: rpm.low,
      rpmHigh: rpm.high
    };
  }
  return {
    longFormMidRoll: bucketRevenue(buckets.longFormMidRoll, AN_RPM.longFormMidRoll, AN_RPM_PESSIMISTIC.longFormMidRoll),
    longFormShort: bucketRevenue(buckets.longFormShort, AN_RPM.longFormShort, AN_RPM_PESSIMISTIC.longFormShort),
    shorts: bucketRevenue(buckets.shorts, AN_RPM.shorts, AN_RPM_PESSIMISTIC.shorts),
    totalLow: 0,
    totalHigh: 0,
    totalViews: 0
  };
}

  const windowListState = { sortBy: 'date', sortDir: 'desc', query: '', channelFilter: null, topicFilter: null, formatFilter: 'long', adOnly: false, longShown: VIDEO_BATCH, shortShown: VIDEO_BATCH };
  async function loadVideosExtraData(){
    try { const r = await fetch('ad-videos.json?t='+Date.now()); if (r.ok){ adVideoData = await r.json(); adVideoIds = new Set(); for (const channelKey of Object.keys(adVideoData.channels || {})) { for (const vid of (adVideoData.channels[channelKey].videoIds || [])) { adVideoIds.add(vid); } } } } catch(e){ console.warn('ad-videos', e); }
    try { const r = await fetch('title-history.json?t='+Date.now()); if (r.ok){ const raw = await r.json(); titleHistoryData = raw.videos || raw.titles || raw; } } catch(e){ console.warn('title-history', e); }
  }
  window.__loadVideosExtraData = loadVideosExtraData;
  let adPanelExpanded = false;
  let adPanelSort = { col: 'views', dir: 'desc' };
function renderVideoRows(videos, emptyText) {
  if (videos.length === 0) {
    return `<div class="group-empty">${emptyText}</div>`;
  }
  const showChannel = ANALYTICS_CHANNEL === 'ALL';
  const showTopics = isTopicChannel();
  // Subject/theme/mode now render as chips inside the title cell (with the
  // per-video summary), so the separate topic column is retired — every row
  // uses the no-topics grid template.
  const topicColClass = ' no-topics';
  return videos.map(v => {
    const channelName = showChannel
      ? (ANALYTICS_DATASET?.channels?.[v.channelId]?.title || '?')
      : '';
    const channelCell = showChannel
      ? `<div class="video-channel">${escapeHtml(channelName)}</div>`
      : '';
    const titleSubtitle = showChannel
      ? `<div class="video-title-channel-tag">${escapeHtml(channelName)}</div>`
      : '';
    // Inline "ad" badge if this video appears in the Google Ads Transparency Centre
    // as one of the channel's paid promotional campaigns. The ⓘ icon signals
    // hoverable detail; the tooltip explains provenance.
    const adBadge = adVideoIds.has(v.id)
      ? `<span class="ad-badge" tabindex="0" role="button" aria-label="Video promoted through paid advertisement" data-popover="Video promoted through paid advertisement (Google Ads Transparency Centre)">ad <span class="ad-badge-info" aria-hidden="true">ⓘ</span></span>`
      : '';
    // Like-rate outlier badge — only renders when the video's like-to-view
    // ratio falls outside the channel's p10-p90 band. The number shown is the
    // % deviation from the channel's median (e.g. ▲ 44% means the rate was
    // 44% higher than typical for this channel). The arrow carries the sign;
    // numbers are absolute magnitude. Tooltip shows the raw rate for anyone
    // who wants the underlying value.
    const likeClass = classifyLikeRate(v);
    let likeBadge = '';
    if (likeClass) {
      const rate = ((v.likes || 0) / (v.views || 1)) * 100;
      const baseline = likeRateBaselines.get(v.channelId);
      const medianRate = baseline ? baseline.median * 100 : 0;
      // Multiplier vs the channel's median rate. Reads unambiguously: "2×"
      // means "twice as much", which is much harder to misread than "+100%"
      // (which a casual reader might parse as "100% of viewers liked it"
      // or "100 percentage points up" — both wrong).
      //
      // Format:
      //  - For high outliers (rate > median): show as Nx (1.4×, 2×, 3.5×).
      //    Round to 1 decimal below 10×, to nearest int above (rare).
      //  - For low outliers (rate < median): same Nx format but the value is
      //    < 1 (e.g. 0.6×). Combined with the ▼ arrow this reads as "less
      //    than typical". Fractional multipliers feel slightly clunky but are
      //    statistically honest — alternatives like "60% of typical" introduce
      //    the same % confusion we're trying to avoid here.
      const multiplier = medianRate > 0 ? rate / medianRate : 0;
      const multiplierStr = multiplier >= 10
        ? Math.round(multiplier) + '×'
        : multiplier.toFixed(1) + '×';
      const tooltip = likeClass === 'high'
        ? `Like rate ${rate.toFixed(1)}% — well above the channel's all-time typical ${medianRate.toFixed(1)}%`
        : `Like rate ${rate.toFixed(1)}% — well below the channel's all-time typical ${medianRate.toFixed(1)}%`;
      const symbol = likeClass === 'high' ? '▲' : '▼';
      // Small thumbs-up SVG — signals "this is about likes" at a glance,
      // so users don't have to read the badge to know what it relates to.
      // Inline rather than CSS background so the icon inherits the badge's
      // text colour (green for high, red for low) automatically.
      const thumbsIcon = `<svg class="like-badge-icon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M2 21h4V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 7.59 6.59C7.22 6.95 7 7.45 7 8v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1z"/></svg>`;
      likeBadge = `<span class="like-badge like-badge-${likeClass}" tabindex="0" role="button" aria-label="${escapeHtml(tooltip)}" data-popover="${escapeHtml(tooltip)}">${thumbsIcon} ${symbol} ${multiplierStr} typical</span>`;
    }
    // "Renamed" badge — renders when this video's title has changed since we
    // first captured it. The popover reveals the full chain (original → … →
    // current); the count flags repeat offenders at a glance.
    let renamedBadge = '';
    const th = titleHistoryData && titleHistoryData[v.id];
    if (th && th.changes && th.changes.length) {
      const n = th.changes.length;
      const chain = [th.first, ...th.changes.map(c => c.to)];
      const lastAt = th.changes[n - 1].at;
      let dateStr = '';
      try { dateStr = new Date(lastAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); } catch (e) {}
      const chainStr = chain.map(t => `"${t}"`).join('  →  ');
      const lead = n === 1 ? 'Renamed once' : `Renamed ${n}×`;
      const pop = `${lead}${dateStr ? ' · last change ' + dateStr : ''}:  ${chainStr}`;
      const penIcon = `<svg class="renamed-badge-icon" viewBox="0 0 24 24" width="11" height="11" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
      const label = n === 1 ? 'renamed' : `renamed ${n}×`;
      renamedBadge = `<span class="renamed-badge" tabindex="0" role="button" aria-label="${escapeHtml(pop)}" data-popover="${escapeHtml(pop)}">${penIcon} ${label}</span>`;
    }
    return `
      <div class="video-row${showChannel ? ' with-channel' : ''}${adVideoIds.has(v.id) ? ' is-ad' : ''}${topicColClass}">
        <div class="video-date">${v.publishedAt.slice(0, 10)}</div>
        ${channelCell}
        <div class="video-title"><div class="video-title-main">${adBadge}<a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer">${escapeHtml(v.title)}</a>${likeBadge}${renamedBadge}</div>${titleSubtitle}${showTopics ? renderVideoSummary(v) : ''}${showTopics ? renderTopicChips(v) : ''}</div>
        <div class="video-duration">${formatDuration(v.durationSec)}</div>
        <div class="video-views">${fmt(v.views)}</div>
        <div class="video-likepct hide-mobile">${(v.views > 0 && v.likes != null) ? ((v.likes / v.views) * 100).toFixed(1) + '%' : '—'}</div>
        <div class="video-comments hide-mobile">${v.comments != null ? fmt(v.comments) : '—'}</div>
      </div>
    `;
  }).join('');
}

function filterVideos(list, query) {
  if (!query) return list;
  const q = query.toLowerCase();
  return list.filter(v => v.title.toLowerCase().includes(q));
}

function sortVideos(list, sortBy, sortDir) {
  const sorted = list.slice().sort((a, b) => {
    let cmp = 0;
    if (sortBy === 'date') {
      cmp = a.publishedAt.localeCompare(b.publishedAt);
    } else if (sortBy === 'duration') {
      cmp = (a.durationSec || 0) - (b.durationSec || 0);
    } else if (sortBy === 'likepct') {
      const ra = (a.views > 0 && a.likes != null) ? a.likes / a.views : -1;
      const rb = (b.views > 0 && b.likes != null) ? b.likes / b.views : -1;
      cmp = ra - rb;
    } else if (sortBy === 'comments') {
      cmp = (a.comments || 0) - (b.comments || 0);
    } else { // views
      cmp = (a.views || 0) - (b.views || 0);
    }
    return sortDir === 'asc' ? cmp : -cmp;
  });
  return sorted;
}

function sortArrow(state, col) {
  if (state.sortBy !== col) return '<span class="sort-arrow"></span>';
  return state.sortDir === 'asc'
    ? '<span class="sort-arrow active">↑</span>'
    : '<span class="sort-arrow active">↓</span>';
}

function sortableClass(state, col) {
  return state.sortBy === col ? ' active-sort' : '';
}

function isTopicChannel() {
  if (!ANALYTICS_TOPICS || !ANALYTICS_TOPIC_TAGS) return false;
  if (ANALYTICS_CHANNEL === 'ALL') return false;
  const channelObj = ANALYTICS_DATASET?.channels?.[ANALYTICS_CHANNEL];
  const TAGGED_HANDLES = ['@TheQuartering', '@JeremyHambly', '@QuarteringLive'];
  return TAGGED_HANDLES.includes(channelObj?.handle);
}

function classifyLikeRate(v) {
  if (v.isShort || v.unavailable) return null;
  const views = v.views || 0;
  const likes = v.likes || 0;
  if (views < 1000 || likes <= 0) return null;
  const ageMs = Date.now() - new Date(v.publishedAt).getTime();
  if (ageMs < 3 * 86400 * 1000) return null;
  const baseline = likeRateBaselines.get(v.channelId);
  if (!baseline) return null;
  const rate = likes / views;
  if (rate >= baseline.p90) return 'high';
  if (rate <= baseline.p10) return 'low';
  return null;
}

// Per-channel breakdown as a compact stat table (replaces the old filter pills
// in the All-channels window view). Informative, not interactive — the channel
// dropdown in the sticky bar is the single source of channel filtering.
function buildChannelBreakdownTable(videos) {
  if (!ANALYTICS_DATASET?.channels) return '';
  const perChannel = new Map();
  for (const id of Object.keys(ANALYTICS_DATASET.channels)) perChannel.set(id, { longCount:0, shortCount:0, views:0 });
  for (const v of videos) {
    const s = perChannel.get(v.channelId);
    if (!s || v.unavailable) continue;
    if (v.isShort) s.shortCount++; else s.longCount++;
    s.views += v.views || 0;
  }
  const orderedIds = orderChannelIds(Object.keys(ANALYTICS_DATASET.channels));
  let tL=0, tS=0, tV=0;
  const rows = orderedIds.map(id => {
    const ch = ANALYTICS_DATASET.channels[id];
    const s = perChannel.get(id) || { longCount:0, shortCount:0, views:0 };
    tL += s.longCount; tS += s.shortCount; tV += s.views;
    const empty = (s.longCount + s.shortCount) === 0;
    return `<tr class="${empty?'cbt-empty':''}">
      <td class="cbt-ch">${escapeHtml(ch.title)}</td>
      <td class="cbt-num">${fmt(s.longCount)}</td>
      <td class="cbt-num">${fmt(s.shortCount)}</td>
      <td class="cbt-num cbt-views">${fmtCompact(s.views)}</td>
    </tr>`;
  }).join('');
  return `<div class="channel-breakdown-table-wrap">
    <table class="channel-breakdown-table">
      <thead><tr><th class="cbt-ch">Channel</th><th class="cbt-num">Long-form</th><th class="cbt-num">Shorts</th><th class="cbt-num">Views</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="cbt-ch">All channels</td><td class="cbt-num">${fmt(tL)}</td><td class="cbt-num">${fmt(tS)}</td><td class="cbt-num cbt-views">${fmtCompact(tV)}</td></tr></tfoot>
    </table>
  </div>`;
}

function renderAdPanel() {
  const panel = document.getElementById('adPanel');
  if (!panel) return;

  // Show whenever we have any ad data loaded (works for a single channel OR
  // All channels — in the latter case we aggregate every channel's ad videos).
  if (!adVideoData || !adVideoIds.size) {
    panel.hidden = true;
    return;
  }
  const isAll = ANALYTICS_CHANNEL === 'ALL';

  // Collect the matched ad videos. For a single channel: just that channel's
  // ad list. For All: every channel's ad list combined.
  let matched = [];
  if (isAll) {
    matched = (ANALYTICS_DATASET.videos || []).filter(v => adVideoIds.has(v.id));
  } else {
    const channelHandle = ANALYTICS_DATASET?.channels?.[ANALYTICS_CHANNEL]?.handle;
    if (!channelHandle) { panel.hidden = true; return; }
    const channelEntry = adVideoData.channels?.[channelHandle];
    if (!channelEntry || !channelEntry.videoIds?.length) { panel.hidden = true; return; }
    const idSet = new Set(channelEntry.videoIds);
    matched = (ANALYTICS_DATASET.videos || []).filter(v => idSet.has(v.id) && v.channelId === ANALYTICS_CHANNEL);
  }
  if (!matched.length) { panel.hidden = true; return; }

  // Headline stats
  const totalViews = matched.reduce((s, v) => s + (v.views || 0), 0);
  const dates = matched.map(v => v.publishedAt).sort();
  const earliest = dates[0].slice(0, 10);
  const latest = dates[dates.length - 1].slice(0, 10);

  // Pre-compute monthly medians of LONG-FORM videos, keyed by channel+month so
  // each ad video is compared against its OWN channel's peers (channels have
  // very different baselines, so a global median would be misleading in All mode).
  const monthlyLongFormViews = {};  // 'channelId|YYYY-MM' -> [views, ...]
  for (const v of ANALYTICS_DATASET.videos) {
    if (v.unavailable || v.isShort) continue;
    if (!(v.views > 0)) continue;
    if (!isAll && v.channelId !== ANALYTICS_CHANNEL) continue;
    const key = v.channelId + '|' + v.publishedAt.slice(0, 7);
    (monthlyLongFormViews[key] ||= []).push(v.views);
  }
  const monthlyMedians = {};
  for (const [k, arr] of Object.entries(monthlyLongFormViews)) {
    monthlyMedians[k] = median(arr);
  }

  // Build per-ad performance rows. For each ad video:
  //   - views (actual)
  //   - median of long-form videos from the same channel + month
  //   - delta: views − median (the "excess" over typical)
  //   - multiplier: views / median (X.Xx the typical video)
  const rows = matched.map(v => {
    const monthKey = v.channelId + '|' + v.publishedAt.slice(0, 7);
    const monthMedian = monthlyMedians[monthKey] || 0;
    const views = v.views || 0;
    const excess = monthMedian > 0 ? views - monthMedian : null;
    const multiplier = monthMedian > 0 ? views / monthMedian : null;
    return { v, views, monthMedian, excess, multiplier, monthKey };
  });

  // Aggregate: how many ads outperformed their month's median? Total excess views?
  const outperformed = rows.filter(r => r.excess !== null && r.excess > 0).length;
  const totalExcess = rows.reduce((s, r) => s + (r.excess && r.excess > 0 ? r.excess : 0), 0);

  function ymLabel(isoDate) {
    const d = new Date(isoDate);
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  }
  function fmtMult(m) {
    if (m == null) return '—';
    if (m >= 1) return `${m.toFixed(1)}× median`;
    return `${(m * 100).toFixed(0)}% of median`;
  }

  // Sort the rows in place according to the current adPanelSort state.
  // Each column has its own sort key extractor and a sensible null/missing
  // handling (missing values always sort to the bottom regardless of direction
  // so they don't pollute either end of the visible list).
  function sortRows(rs) {
    const { col, dir } = adPanelSort;
    const factor = dir === 'asc' ? 1 : -1;
    const keyFns = {
      title: r => r.v.title.toLowerCase(),
      date:  r => r.v.publishedAt,
      views: r => r.views,
      median: r => r.monthMedian,
      perf: r => r.multiplier,
      excess: r => r.excess,
    };
    const keyFn = keyFns[col] || keyFns.views;
    return rs.slice().sort((a, b) => {
      const av = keyFn(a), bv = keyFn(b);
      // Push null/undefined/0-median rows to the bottom regardless of direction
      const aMissing = av == null || (col === 'median' && av === 0);
      const bMissing = bv == null || (col === 'median' && bv === 0);
      if (aMissing && bMissing) return 0;
      if (aMissing) return 1;
      if (bMissing) return -1;
      if (av < bv) return -1 * factor;
      if (av > bv) return 1 * factor;
      return 0;
    });
  }

  // Render just the tbody — called on initial render AND on sort changes.
  // Pulled out so sort clicks don't re-render the whole panel (which would
  // collapse it back to closed, lose scroll position, etc).
  function renderAdTableBody() {
    const sorted = sortRows(rows);
    return sorted.map(r => `
      <tr>
        <td class="col-vid">
          <a href="https://www.youtube.com/watch?v=${r.v.id}" target="_blank" rel="noopener">${escapeHtml(r.v.title)}</a>
          <span class="ad-perf-date">${r.v.publishedAt.slice(0, 10)}${isAll ? ' · ' + escapeHtml(ANALYTICS_DATASET?.channels?.[r.v.channelId]?.title || '') : ''}</span>
        </td>
        <td class="col-num">${fmt(r.views)}</td>
        <td class="col-num hide-mobile">${r.monthMedian ? fmt(Math.round(r.monthMedian)) : '—'}</td>
        <td class="col-num">${fmtMult(r.multiplier)}</td>
        <td class="col-num hide-mobile">${r.excess == null ? '—' : (r.excess > 0 ? '+' + fmt(r.excess) : fmt(r.excess))}</td>
      </tr>
    `).join('');
  }

  // Header cell with sort indicator. Active column gets an arrow; inactive
  // columns get a faint placeholder so the layout doesn't shift on sort change.
  function sortHeader(label, colKey, extraClass = '') {
    const isActive = adPanelSort.col === colKey;
    const arrow = isActive
      ? (adPanelSort.dir === 'asc' ? '<span class="sort-arrow active">↑</span>' : '<span class="sort-arrow active">↓</span>')
      : '<span class="sort-arrow"></span>';
    // Use proper table semantics: aria-sort communicates state to screen readers
    // ("Views, column header, sorted descending"). Native <th> already implies
    // columnheader role, so we don't override with role="button" — that would
    // confuse assistive tech into announcing "button" instead of "column header".
    const ariaSort = isActive ? (adPanelSort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    return `<th class="${extraClass} sortable${isActive ? ' active-sort' : ''}" data-ad-sort="${colKey}" aria-sort="${ariaSort}" tabindex="0">${label}${arrow}</th>`;
  }

  panel.hidden = false;
  // Apply persisted state — ad panel only re-renders on channel changes (it
  // doesn't depend on the date filter), so the issue is milder than the
  // revenue panel, but consistent UX wins by preserving state here too.
  panel.innerHTML = `
    <button type="button" class="ad-panel-toggle" aria-expanded="${adPanelExpanded}" id="adPanelToggle">
      <div class="ad-panel-header">
        <div class="ad-panel-header-left">
          <span class="ad-panel-eyebrow">Confirmed paid promotion</span>
          <span class="ad-panel-summary"><span title="${fmt(totalViews)} total views">${matched.length} videos · ${fmtCompact(totalViews)} views · ${ymLabel(earliest)}–${ymLabel(latest)}</span></span>
        </div>
        <span class="ad-panel-caret" aria-hidden="true"></span>
      </div>
    </button>
    <div class="ad-panel-body" id="adPanelBody"${adPanelExpanded ? '' : ' hidden'}>
      ${outperformed > 0 ? `
        <div class="ad-panel-callout">
          <div class="ad-panel-callout-stat">
            <div class="ad-panel-callout-value">${outperformed} <span class="ad-panel-callout-of">/ ${rows.length}</span></div>
            <div class="ad-panel-callout-label">ad-promoted videos beat their month's median</div>
          </div>
          <div class="ad-panel-callout-stat">
            <div class="ad-panel-callout-value">+${fmtCompact(totalExcess)}</div>
            <div class="ad-panel-callout-label">excess views above the monthly median</div>
          </div>
          <div class="ad-panel-callout-stat">
            <div class="ad-panel-callout-value">${fmtUSD(totalExcess * 0.03, true)}–${fmtUSD(totalExcess * 0.10, true)}</div>
            <div class="ad-panel-callout-label">estimated paid-promotion spend
              <span class="ad-panel-callout-info" tabindex="0" role="button"
                    aria-label="About the spend estimate"
                    data-popover="Rough upper-bound estimate: excess views × industry CPV benchmarks ($0.03 low, $0.10 high). Excess views are a proxy for the paid uplift; some may be organic. Actual spend is likely lower than the upper bound.">ⓘ</span>
            </div>
          </div>
        </div>
      ` : ''}
      <div class="ad-perf-table-wrap">
        <table class="ad-perf-table">
          <thead>
            <tr>
              ${sortHeader('Video', 'title', 'col-vid')}
              ${sortHeader('Views', 'views', 'col-num')}
              ${sortHeader('Month median', 'median', 'col-num hide-mobile')}
              ${sortHeader('Performance', 'perf', 'col-num')}
              ${sortHeader('Excess over median', 'excess', 'col-num hide-mobile')}
            </tr>
          </thead>
          <tbody id="adPerfTableBody">
            ${renderAdTableBody()}
          </tbody>
        </table>
      </div>
      <div class="ad-panel-footnote">
        <strong>Reading this table:</strong> each video's views compared to the median views of long-form videos uploaded the same month.
        A video at 2× median earned twice as many views as the typical upload that month. "Excess over median" is the views above the typical baseline —
        a rough proxy for the impact of paid promotion, though some excess may reflect organic virality.
        Individual videos are also flagged with an <span class="ad-badge">ad</span> badge in the lists below.
        <br><br>
        <strong>Estimated spend</strong> multiplies excess views by industry CPV (cost-per-view) benchmarks of $0.03–$0.10
        (good–expensive bands for YouTube ad campaigns). This is an UPPER-BOUND estimate: excess views are a proxy for the paid uplift,
        but some excess may be organic (a hit video doing well on its own merits), and Google bills per qualified view rather than total view, so total view counts
        don't directly map to ad spend. Actual spend is likely lower than the upper bound.
        Identified via the <a href="${escapeHtml(adVideoData.meta?.source || '#')}" target="_blank" rel="noopener">Google Ads Transparency Centre</a>.
      </div>
    </div>
  `;

  // Sort handlers — attach to each sortable header.
  // Clicking the active column flips direction; clicking a new column starts at
  // descending (intuitive default for numeric columns where users typically want
  // "biggest first"). Exception: title column starts at ascending (A–Z is the
  // natural first read).
  panel.querySelectorAll('[data-ad-sort]').forEach(th => {
    function doSort() {
      const col = th.getAttribute('data-ad-sort');
      if (adPanelSort.col === col) {
        adPanelSort.dir = adPanelSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        adPanelSort.col = col;
        adPanelSort.dir = col === 'title' ? 'asc' : 'desc';
      }
      // Re-render tbody + refresh header arrows (without rebuilding the whole panel)
      document.getElementById('adPerfTableBody').innerHTML = renderAdTableBody();
      panel.querySelectorAll('[data-ad-sort]').forEach(hdr => {
        const isActive = hdr.getAttribute('data-ad-sort') === adPanelSort.col;
        hdr.classList.toggle('active-sort', isActive);
        // Update aria-sort so screen readers announce the current sort state
        hdr.setAttribute('aria-sort', isActive ? (adPanelSort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
        const arrow = hdr.querySelector('.sort-arrow');
        if (arrow) {
          arrow.className = 'sort-arrow' + (isActive ? ' active' : '');
          arrow.textContent = isActive ? (adPanelSort.dir === 'asc' ? '↑' : '↓') : '';
        }
      });
    }
    th.addEventListener('click', doSort);
    th.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        doSort();
      }
    });
  });
}

// Shorten a mode's display name for a compact chip (full name stays in the
// tooltip). "Woke / culture war" -> "Woke"; "Politics & current events" ->
// "Politics"; "'[Group] fatigue' rhetoric" -> "Group fatigue".
function shortModeLabel(name) {
  let s = String(name || '').replace(/['"\[\]]/g, '').trim();
  s = s.split(/\s+[/&]\s+/)[0].trim();
  const w = s.split(/\s+/);
  if (w.length > 2) s = w.slice(0, 2).join(' ');
  return s || String(name || '');
}

// One clickable chip for a given axis (subject | theme | mode). Clicking filters
// the window list to that value (handled by the delegated #windowList listener).
function topicChip(kind, id) {
  const t = ANALYTICS_TOPICS?.[id];
  if (!t) return '';
  const full = t.name || id;
  const label = kind === 'mode' ? shortModeLabel(full) : full;
  const kindLabel = kind === 'subject' ? 'Subject' : kind === 'theme' ? 'Theme' : 'Mode';
  const tf = windowListState.topicFilter;
  const activeCls = (tf && tf.kind === kind && tf.id === id) ? ' vchip-on' : '';
  return `<button type="button" class="vchip vchip-${kind}${activeCls}" data-tfk="${kind}" data-tfi="${escapeHtml(id)}" title="${escapeHtml(kindLabel + ': ' + full)} — click to filter" aria-label="Filter by ${escapeHtml(kindLabel)}: ${escapeHtml(full)}"><span class="vchip-dot" style="background:${t.color || '#888'}"></span>${escapeHtml(label)}</button>`;
}

// Per-video human-readable summary (the LLM one-liner) shown under the title.
function renderVideoSummary(v) {
  const s = ANALYTICS_SUMMARIES?.[v.id];
  return s ? `<div class="video-summary">${escapeHtml(s)}</div>` : '';
}

// Subject · theme · mode chip row. Any axis may be absent for a given video.
function renderTopicChips(v) {
  const subj = ANALYTICS_TOPIC_TAGS?.[v.id];
  const thm = ANALYTICS_TOPIC_THEMES?.[v.id];
  const mod = ANALYTICS_TOPIC_MODES?.[v.id];
  // Suppress a theme chip that merely echoes the mode (e.g. theme "Politics"
  // next to mode "Politics & current events", or "Woke Culture" next to "Woke").
  // Specific themes (Race & Crime, DEI, Immigration…) are unaffected and still show.
  let showTheme = !!thm;
  if (thm && mod) {
    const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const tn = norm(ANALYTICS_TOPICS?.[thm]?.name);
    const mShort = norm(shortModeLabel(ANALYTICS_TOPICS?.[mod]?.name || ''));
    if (tn && mShort && (tn === mShort || tn.includes(mShort) || mShort.includes(tn))) showTheme = false;
  }
  const chips = [
    subj ? topicChip('subject', subj) : '',
    showTheme ? topicChip('theme', thm) : '',
    mod ? topicChip('mode', mod) : ''
  ].filter(Boolean).join('');
  return chips ? `<div class="video-chips">${chips}</div>` : '';
}

function formatWindowTitle(startDate, endDate) {
  // Single day vs multi-day window
  const sameDay = startDate === endDate;
  function pretty(d) {
    const dt = new Date(d + 'T00:00:00Z');
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  }
  if (sameDay) return `Videos uploaded on ${pretty(startDate)}`;
  return `Videos from ${pretty(startDate)} to ${pretty(endDate)}`;
}

function renderWindowList(startDate, endDate) {
  document.getElementById('windowTitle').textContent = formatWindowTitle(startDate, endDate);

  const start = new Date(startDate + 'T00:00:00Z');
  const end = new Date(endDate + 'T23:59:59Z');
  const allWindowVideos = anFilteredVideos().filter(v => {
    const d = new Date(v.publishedAt);
    return d >= start && d <= end;
  });

  // Compute per-channel breakdown (only meaningful in All-combined mode)
  const showChannel = ANALYTICS_CHANNEL === 'ALL';
  // Topic column only shows for single tagged channels (matches the data-row
  // logic in the row builder). Header must use the same flag so its grid
  // template and cells line up with the rows.
  const showTopics = isTopicChannel();
  const topicColClass = showTopics ? '' : ' no-topics';

  // Apply channel filter if active
  let scopedVideos = allWindowVideos;
  if (showChannel && windowListState.channelFilter) {
    scopedVideos = allWindowVideos.filter(v => v.channelId === windowListState.channelFilter);
  }
  // Apply ad-only filter if active (only meaningful when ad data is loaded)
  const adDataAvailable = !!(adVideoIds && adVideoIds.size);
  if (windowListState.adOnly && adDataAvailable) {
    scopedVideos = scopedVideos.filter(v => adVideoIds.has(v.id));
  }
  // Apply topic-chip filter (subject / theme / mode), set by clicking a chip.
  if (windowListState.topicFilter) {
    const { kind, id } = windowListState.topicFilter;
    const map = kind === 'subject' ? ANALYTICS_TOPIC_TAGS
      : kind === 'theme' ? ANALYTICS_TOPIC_THEMES
      : ANALYTICS_TOPIC_MODES;
    scopedVideos = scopedVideos.filter(v => map && map[v.id] === id);
  }

  // Filter + sort
  const filtered = filterVideos(scopedVideos, windowListState.query);
  const sorted = sortVideos(filtered, windowListState.sortBy, windowListState.sortDir);

  const list = document.getElementById('windowList');
  if (allWindowVideos.length === 0) {
    list.innerHTML = `<div class="window-empty">No videos uploaded in this range.</div>`;
    return;
  }

  // Build per-channel chip row (All-combined only) — interactive filter mode
  const breakdownHtml = showChannel ? buildChannelBreakdownTable(allWindowVideos) : '';

  const colHeader = `
    <div class="video-row video-row-header${showChannel ? ' with-channel' : ''} no-topics">
      <div class="video-date sortable${sortableClass(windowListState, 'date')}" data-sort="date">Date${sortArrow(windowListState, 'date')}</div>
      ${showChannel ? '<div class="video-channel">Channel</div>' : ''}
      <div class="video-title">Title</div>
      <div class="video-duration sortable hide-mobile${sortableClass(windowListState, 'duration')}" data-sort="duration">Duration${sortArrow(windowListState, 'duration')}</div>
      <div class="video-views sortable${sortableClass(windowListState, 'views')}" data-sort="views">Views${sortArrow(windowListState, 'views')}</div>
      <div class="video-likepct sortable hide-mobile${sortableClass(windowListState, 'likepct')}" data-sort="likepct">Like %${sortArrow(windowListState, 'likepct')}</div>
      <div class="video-comments sortable hide-mobile${sortableClass(windowListState, 'comments')}" data-sort="comments">Comments${sortArrow(windowListState, 'comments')}</div>
    </div>
  `;

  // Split the sorted video list into long-form and shorts. The monthly view
  // already separates these into expandable groups; the window view follows the
  // same pattern so the long-form story stays uncluttered by Shorts noise (which
  // typically dominates by count but contributes a small share of views). Each
  // group has its own count + total-views header. Sort order is shared so toggling
  // a column header applies consistently across both groups.
  const longSorted = sorted.filter(v => !v.isShort && !v.unavailable);
  const shortSorted = sorted.filter(v => v.isShort && !v.unavailable);
  const longViewsTotal = longSorted.reduce((s, v) => s + (v.views || 0), 0);
  const shortViewsTotal = shortSorted.reduce((s, v) => s + (v.views || 0), 0);

  function group(label, videos, totalViews, key) {
    if (videos.length === 0 && !windowListState.query) {
      // Skip empty groups entirely when no search is active.
      // (When a search IS active, we still show "no matches" so the user
      // doesn't think their search broke the page.)
      return '';
    }
    const shownKey = key === 'long' ? 'longShown' : 'shortShown';
    const shown = Math.min(windowListState[shownKey], videos.length);
    const visible = videos.slice(0, shown);
    const remaining = videos.length - shown;
    const moreBtn = remaining > 0
      ? `<button type="button" class="window-list-more" data-show-more="${key}">Show ${Math.min(VIDEO_BATCH, remaining)} more <span class="wlm-rem">(${fmt(remaining)} remaining)</span></button>`
      : '';
    return `
      <div class="window-list-group">
        <div class="window-list-group-header">
          <span class="window-list-group-label">${label}</span>
          <span class="window-list-group-meta">${videos.length} video${videos.length === 1 ? '' : 's'} · ${fmt(totalViews)} views</span>
        </div>
        ${renderVideoRows(visible, windowListState.query ? `No ${label.toLowerCase()} match your search` : `No ${label.toLowerCase()} in this range`)}
        ${moreBtn}
      </div>
    `;
  }

  // Active topic-chip filter indicator (when a chip has been clicked)
  let topicFilterBar = '';
  if (windowListState.topicFilter) {
    const tf = windowListState.topicFilter;
    const t = ANALYTICS_TOPICS?.[tf.id];
    const nm = t?.name || tf.id;
    const kindLabel = tf.kind === 'subject' ? 'Subject' : tf.kind === 'theme' ? 'Theme' : 'Mode';
    const shown = tf.kind === 'mode' ? shortModeLabel(nm) : nm;
    topicFilterBar = `<div class="topic-filter-bar">Filtered to <span class="tf-kind">${kindLabel}</span><span class="tf-name"><span class="vchip-dot" style="background:${t?.color || '#888'}"></span>${escapeHtml(shown)}</span><button type="button" class="tf-clear" id="topicFilterClear" aria-label="Clear topic filter">clear ✕</button></div>`;
  }

  list.innerHTML = `
    <div class="window-list-search">
      <input type="text" id="windowListSearch" placeholder="Search titles…" value="${escapeHtml(windowListState.query)}">
      <div class="window-format-toggle" id="windowFormatToggle" role="group" aria-label="Video format">
        <button type="button" class="wf-btn${windowListState.formatFilter==='long'?' active':''}" data-format="long">Long-form</button>
        <button type="button" class="wf-btn${windowListState.formatFilter==='short'?' active':''}" data-format="short">Shorts</button>
      </div>
      ${adDataAvailable ? `<button type="button" class="ad-only-btn${windowListState.adOnly?' active':''}" id="adOnlyBtn" aria-pressed="${windowListState.adOnly}">📣 Ads only</button>` : ''}
    </div>
    ${topicFilterBar}
    ${breakdownHtml}
    <div class="window-list-rows">
      ${colHeader}
      ${windowListState.formatFilter !== 'short' ? group('Long-form', longSorted, longViewsTotal, 'long') : ''}
      ${windowListState.formatFilter !== 'long' ? group('Shorts', shortSorted, shortViewsTotal, 'short') : ''}
    </div>
  `;
}

  // Entry: render the Videos tab for the current channel + time window.
  window.renderVideosTab = function(){
    const sc = (typeof scope !== 'undefined') ? scope : 'ALL';
    ANALYTICS_CHANNEL = sc === 'ALL' ? 'ALL' : (HANDLE_TO_ID[sc] || 'ALL');
    likeRateBaselines = computeAnalyticsBaselines();
    const sd = document.getElementById('startDate'), ed = document.getElementById('endDate');
    if (sd && ed && sd.value && ed.value) {
      renderWindowList(sd.value, ed.value);
    }
    if (typeof renderAdPanel === 'function') { try { renderAdPanel(); } catch(e){ console.error('ad panel', e); } }
    if (typeof window.renderRevenuePanel === 'function') { try { window.renderRevenuePanel(); } catch(e){ console.error('revenue panel', e); } }
    // Keep the word cloud in sync with the Videos-tab filters when it's open.
    const wcToggle = document.getElementById('wordcloudToggle');
    if (wcToggle && wcToggle.getAttribute('aria-expanded') === 'true' && typeof window.renderWordCloud === 'function') {
      try { window.renderWordCloud(); } catch(e){ console.error('wordcloud', e); }
    }
  };
  // Window-list interactions (delegated; scoped to #windowList)
  function resetVideoBatches(){ windowListState.longShown = VIDEO_BATCH; windowListState.shortShown = VIDEO_BATCH; }
  window.__resetVideoBatches = resetVideoBatches;
  document.addEventListener('click', (e) => {
    // Incremental loading: reveal the next batch of rows for a group
    const moreBtn = e.target.closest('[data-show-more]');
    if (moreBtn && document.getElementById('windowList')?.contains(moreBtn)) {
      const key = moreBtn.dataset.showMore;
      if (key === 'long') windowListState.longShown += VIDEO_BATCH;
      else windowListState.shortShown += VIDEO_BATCH;
      const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
      if (sd && ed) renderWindowList(sd, ed); return;
    }
    // Topic chip clicked → filter the list to that subject/theme/mode (toggle off if same)
    const chip = e.target.closest('.vchip[data-tfk]');
    if (chip && document.getElementById('windowList')?.contains(chip)) {
      const kind = chip.dataset.tfk, id = chip.dataset.tfi;
      const cur = windowListState.topicFilter;
      windowListState.topicFilter = (cur && cur.kind === kind && cur.id === id) ? null : { kind, id };
      resetVideoBatches();
      const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
      if (sd && ed) renderWindowList(sd, ed); return;
    }
    // Clear the active topic filter
    const tfClear = e.target.closest('#topicFilterClear');
    if (tfClear && document.getElementById('windowList')?.contains(tfClear)) {
      windowListState.topicFilter = null;
      resetVideoBatches();
      const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
      if (sd && ed) renderWindowList(sd, ed); return;
    }
    // Ads-only filter
    const adBtn = e.target.closest('#adOnlyBtn');
    if (adBtn && document.getElementById('windowList')?.contains(adBtn)) {
      windowListState.adOnly = !windowListState.adOnly;
      resetVideoBatches();
      const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
      if (sd && ed) renderWindowList(sd, ed); return;
    }
    // Format filter: Long-form / Shorts / All
    const wf = e.target.closest('#windowFormatToggle .wf-btn');
    if (wf && document.getElementById('windowList')?.contains(wf)) {
      windowListState.formatFilter = wf.dataset.format;
      resetVideoBatches();
      const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
      if (sd && ed) renderWindowList(sd, ed);
      const wcToggle = document.getElementById('wordcloudToggle');
      if (wcToggle && wcToggle.getAttribute('aria-expanded') === 'true' && typeof window.renderWordCloud === 'function') {
        try { window.renderWordCloud(); } catch(_){}
      }
      return;
    }
    const header = e.target.closest('#windowList .video-row-header .sortable');
    if (!header) return;
    const col = header.dataset.sort;
    if (windowListState.sortBy === col) windowListState.sortDir = windowListState.sortDir === 'asc' ? 'desc' : 'asc';
    else { windowListState.sortBy = col; windowListState.sortDir = 'desc'; }
    resetVideoBatches();
    const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
    if (sd && ed) renderWindowList(sd, ed);
  });
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'windowListSearch') return;
    windowListState.query = e.target.value;
    resetVideoBatches();
    const caretPos = e.target.selectionStart;
    const sd=document.getElementById('startDate').value, ed=document.getElementById('endDate').value;
    if (sd && ed) renderWindowList(sd, ed);
    const ni = document.getElementById('windowListSearch');
    if (ni){ ni.focus(); ni.setSelectionRange(caretPos, caretPos); }
  });
  // ad panel toggle (delegated; single handler to avoid double-toggle)
  document.addEventListener('click', (e) => {
    const t = e.target.closest('#adPanelToggle');
    if (!t) return;
    const exp = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!exp));
    const body = document.getElementById('adPanelBody');
    if (body) body.hidden = exp;
    if (typeof adPanelExpanded !== 'undefined') adPanelExpanded = !exp;
  });

})();

    const cid = sc==='ALL'?'ALL':(HANDLE_TO_ID[sc]||'ALL');
    let md = buildMonthlyData(cid);
    const cutoff = vidCutoffMonth(vidTimePreset);
    if (cutoff) md = md.filter(m=>m.key>=cutoff);
    if (!md.length){ sd.value=''; ed.value=''; return; }
    const first=md[0].key, last=md[md.length-1].key;
    sd.value=first+'-01';
    const [ly,lm]=last.split('-').map(Number); const lastDay=new Date(ly,lm,0).getDate();
    ed.value=`${last}-${String(lastDay).padStart(2,'0')}`;
  };
  window.__populateVidChannel = function(){
    const sel=document.getElementById('vidChannelSel');
    if (!sel || typeof CHANNELS==='undefined' || !CHANNELS) return;
    const cur=(typeof scope!=='undefined')?scope:'ALL';
    sel.innerHTML=['ALL',...CHANNELS].map(s=>`<option value="${s}"${s===cur?' selected':''}>${(typeof SCOPE_LABEL!=='undefined'&&SCOPE_LABEL[s])||s}</option>`).join('');
    populatePeriodDropdown(document.getElementById('vidPeriodSel'), vidTimePreset);
  };
  const vidChannelSel = document.getElementById('vidChannelSel');
  if (vidChannelSel) {
    vidChannelSel.addEventListener('change', (e) => {
      if (typeof scope !== 'undefined') {
        scope = e.target.value;
        if (typeof availableMonths==='function' && typeof refresh==='function') {
          const months=availableMonths(); const cm=(typeof m!=='undefined')?m:months[0];
          refresh(months.includes(cm)?cm:months[0]);
        }
      }
      if (window.__populateAnChannel) window.__populateAnChannel();
      if (window.__resetVideoBatches) window.__resetVideoBatches();
      window.__syncVidWindow(); if (window.renderVideosTab) window.renderVideosTab();
    });
  }
  const vidPeriod = document.getElementById('vidPeriodSel');
  if (vidPeriod) {
    vidPeriod.addEventListener('change', (e) => {
      vidTimePreset = e.target.value;
      if (window.__resetVideoBatches) window.__resetVideoBatches();
      window.__syncVidWindow(); if (window.renderVideosTab) window.renderVideosTab();
    });
  }
  // Word cloud toggle (Analysis deep-dive)
  const wcToggle = document.getElementById('wordcloudToggle');
  if (wcToggle) {
    wcToggle.addEventListener('click', () => {
      const exp = wcToggle.getAttribute('aria-expanded') === 'true';
      wcToggle.setAttribute('aria-expanded', String(!exp));
      const panel = document.getElementById('wordcloudPanel');
      if (panel) panel.hidden = exp;
      if (!exp && typeof window.renderWordCloud === 'function') { try { window.renderWordCloud(); } catch(e){ console.error('wordcloud', e); } }
    });
  }
  let initial = 'overview';
  try { initial = new URLSearchParams(location.search).get('tab') || 'overview'; } catch(_){}
  show(initial);
})();

(async function init(){
  try {
    PAYLOAD = await loadAndCompute();
    SCOPES = PAYLOAD.scopes; NET = PAYLOAD.net; CHANNELS = PAYLOAD.channels; PEAKS = PAYLOAD.peaks;
    HANDLE_TO_ID = PAYLOAD.handleToId || {};
    // Last-updated indicator (relative time, from data.json meta.lastUpdated)
    if (PAYLOAD.meta && PAYLOAD.meta.lastUpdated) {
      const el = document.getElementById('lastUpdated');
      const txt = el && el.querySelector('.status-text');
      if (txt) {
        const d = new Date(PAYLOAD.meta.lastUpdated);
        const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
        let rel;
        if (mins < 1) rel = 'just now';
        else if (mins < 60) rel = `${mins} minute${mins===1?'':'s'} ago`;
        else if (mins < 1440) { const h = Math.round(mins/60); rel = `${h} hour${h===1?'':'s'} ago`; }
        else { const dd = Math.round(mins/1440); rel = `${dd} day${dd===1?'':'s'} ago`; }
        txt.textContent = `Updated ${rel}`;
        el.title = d.toLocaleString('en-GB');
      }
    }
    if (window.__loadVideosExtraData) { try { await window.__loadVideosExtraData(); } catch(e){} }
    buildScopeLabels();
    const params=new URLSearchParams(location.search);
    const qv=params.get('view'); if(qv && (qv==='ALL'||CHANNELS.includes(qv))){ scope=qv; }
    const qm=params.get('month');
    // default to the latest available month in scope (not a hardcoded date)
    const months = availableMonths();
    const startMonth = (qm && SCOPES[scope][qm] && !SCOPES[scope][qm].shortsOnly) ? qm : months[0];
    refresh(startMonth);
    // refresh() only paints the Overview tab. On a hard refresh the active tab
    // may be Analysis or Videos (restored from ?tab=), and tabShell's initial
    // show() ran BEFORE data finished loading — so those tabs rendered against
    // no data and came up blank. Now that data is in, re-render whichever tab
    // is actually active so it paints. (Overview is already handled by refresh.)
    try {
      const activeTab = (new URLSearchParams(location.search).get('tab')) || 'overview';
      if (activeTab === 'videos' && typeof window.renderVideosTab === 'function') {
        if (window.__populateVidChannel) window.__populateVidChannel();
        if (window.__syncVidWindow) window.__syncVidWindow();
        window.renderVideosTab();
      } else if (activeTab === 'analysis' && typeof window.renderAnalysisChart === 'function') {
        if (window.__populateAnChannel) window.__populateAnChannel();
        window.renderAnalysisChart();
      }
    } catch(e){ console.error('post-load active-tab render', e); }
  } catch(err){
    document.getElementById('report').innerHTML =
      '<div style="padding:3rem;text-align:center;color:var(--down)">Could not load report data. '
      + 'Please refresh.</div>';
    console.error('Monthly report load failed:', err);
  }
})();

</script>
