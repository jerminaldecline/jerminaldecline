name: Daily audit (deletion check)

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'  # second daily pass (2026-07-16): halves the blind
                          # window for deletions/retitles on catalogue videos
                          # older than the incremental 60-day window
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-data.yml / detect-topic-candidates.yml so main-committing
# jobs never run concurrently (both this and update-data rewrite data.json —
# a concurrent pair always conflicts on meta.lastUpdated).
concurrency:
  group: main-data-push
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run audit
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-data.js --audit

      # Resolve WHY newly-removed videos are gone (private / copyright / ToS / …)
      # by reading each watch page's playabilityStatus. Best-effort: YouTube
      # frequently bot-walls datacenter IPs, so this must never fail the build —
      # on a blocked run the existing removed-reasons.json simply persists.
      - name: Resolve removed-video reasons (best-effort)
        continue-on-error: true
        run: node scripts/resolve-removed-reasons.js

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Audit also refreshes descriptions and titles on older videos, so
          # stage those side-files alongside data.json (the title-change ledger
          # is where re-titles of aged-out videos get recorded).
          git add public/data.json public/descriptions.json public/title-history.json public/removed-reasons.json
          if git diff --staged --quiet; then
            echo "Audit found no changes."
            exit 0
          fi
          git commit -m "chore: daily audit ($(date -u '+%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts."
          exit 1
