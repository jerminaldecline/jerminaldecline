name: Daily audit (deletion check)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run audit
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-data.js --audit

      - name: Commit audited data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Audit also refreshes descriptions and titles on older videos, so
          # stage those side-files alongside data.json (the title-change ledger
          # is where re-titles of aged-out videos get recorded).
          git add public/data.json public/descriptions.json public/title-history.json
          if git diff --staged --quiet; then
            echo "Audit found no changes."
            exit 0
          fi
          git commit -m "chore: daily audit ($(date -u '+%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts."
          exit 1
