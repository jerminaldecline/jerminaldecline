name: Update channel data

on:
  schedule:
    # Hourly (2026-07-16): deleted-video tracking and retitle detection can
    # miss changes that happen between scans, so the blind window is now ~1h
    # for anything inside the 60-day incremental window. Quota cost ~65
    # units/run -> ~1,600/day of the 10,000 daily budget; Actions minutes are
    # free (public repo). The snapshot step is idempotent on AM/PM halves, so
    # this still produces exactly two snapshots a day; a single hourly cron
    # also bunches less under GitHub's flaky scheduler than several scattered
    # ones, which means fewer spurious concurrency-cancellation emails.
    - cron: '7 * * * *'
  workflow_dispatch:  # allows manual runs from the Actions tab
    inputs:
      backfill:
        description: 'Full historical backfill — refreshes ALL titles/views across the whole catalogue, not just the 60-day window. Leave off for a normal run.'
        type: boolean
        default: false

permissions:
  contents: write

# Serialize with every other workflow that commits to main (daily-audit,
# detect-topic-candidates share this group). GitHub's scheduler bunches delayed
# runs together, and two jobs rewriting data.json concurrently always conflict
# on meta.lastUpdated — a rebase the retry loop cannot resolve.
concurrency:
  group: main-data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            echo "Manual full backfill requested."
            node scripts/fetch-data.js --backfill
          else
            node scripts/fetch-data.js
          fi

      # The fetcher only learns that a video is GONE; the reason comes from the
      # watch page. The strike banner keys off that reason code, so a removal
      # with no entry yet cannot raise a banner however serious it was — it just
      # reads "Deleted or private". On the audit's twice-daily schedule alone,
      # a Community Guidelines strike found at 20:55 UTC stayed invisible until
      # 02:00 (2026-08-13), and one found just after 02:00 waited until 14:00.
      #
      # Incremental by default: it re-scrapes nothing already classified, so the
      # usual hourly cost is zero requests and it only reaches YouTube on the
      # rare hour a removal is actually detected. Best-effort — datacenter IPs
      # get bot-walled, and the audit re-runs it anyway, so a failure here must
      # never fail an otherwise good data update.
      - name: Resolve removed-video reasons (best-effort)
        continue-on-error: true
        run: node scripts/resolve-removed-reasons.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the channel data, the descriptions side-file, the title-change
          # ledger, and the removal-reason side-file. The fetcher writes the
          # first three alongside data.json and the resolver step writes the
          # fourth; without staging each explicitly they'd be silently dropped
          # when the workflow runner is torn down.
          git add public/data.json public/descriptions.json public/title-history.json public/removed-reasons.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update channel data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # Retry push with a rebase if someone else pushed in the meantime
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts."
          exit 1

      - name: Snapshot data (twice-daily AM/PM) + hourly debut sample
        # Best-effort: if this fails (auth glitch, sister repo down),
        # the main data update has already succeeded — don't fail the workflow.
        # The staleness tripwire at the end of the job is what turns a persistent
        # failure here into a red run.
        continue-on-error: true
        env:
          SNAPSHOTS_TOKEN: ${{ secrets.SNAPSHOTS_REPO_TOKEN }}
          SNAPSHOTS_REPO: jerminaldecline/jerminaldecline-snapshots
        run: |
          set -e
          DATE=$(date -u '+%Y-%m-%d')
          HOUR=$(date -u '+%H')
          if [ "$HOUR" -lt 12 ]; then HALF="AM"; else HALF="PM"; fi
          SNAPSHOT_FILE="${DATE}-${HALF}.json.gz"

          git clone --depth 1 "https://x-access-token:${SNAPSHOTS_TOKEN}@github.com/${SNAPSHOTS_REPO}.git" /tmp/snapshots

          # The twice-daily full dump runs FIRST and is unchanged — still idempotent
          # per half. It is the irreplaceable artefact, so nothing optional is
          # allowed to run ahead of it and risk aborting the step under `set -e`.
          if [ -f "/tmp/snapshots/snapshots/${SNAPSHOT_FILE}" ]; then
            echo "Snapshot ${SNAPSHOT_FILE} already exists — skipping the full dump."
          else
            mkdir -p /tmp/snapshots/snapshots
            gzip -c public/data.json > "/tmp/snapshots/snapshots/${SNAPSHOT_FILE}"
            echo "Wrote snapshot ${SNAPSHOT_FILE}."
          fi

          # Hourly debut sample. Nearly all of a video's views arrive on its first
          # day, which twice-daily snapshots cannot resolve. This run already
          # fetched every view count, so keeping the reading costs no extra API
          # quota — it just stops discarding 22 of the 24 daily readings.
          # Explicitly non-fatal: a sampler bug must never cost us a snapshot.
          mkdir -p /tmp/snapshots/debut
          node scripts/sample-debut.js --out /tmp/snapshots/debut || echo "::warning::debut sample failed — snapshot unaffected"

          cd /tmp/snapshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A snapshots debut
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "snapshot ${DATE} ${HALF} + debut ${DATE}-${HOUR}"
          for attempt in 1 2 3; do
            if git push; then
              echo "Snapshot push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Pulling and retrying..."
            git pull --rebase
          done
          echo "Snapshot push failed after 3 attempts."
          exit 1

      - name: Rebuild view-velocity.json
        # Regenerates the "View Velocity" feature data from the full snapshot
        # archive (launch curves + flat-then-spike movers). Best-effort: the
        # main data update has already committed, so a hiccup here mustn't fail
        # the run. Runs after the snapshot step so it includes today's capture.
        continue-on-error: true
        env:
          SNAPSHOTS_TOKEN: ${{ secrets.SNAPSHOTS_REPO_TOKEN }}
          SNAPSHOTS_REPO: jerminaldecline/jerminaldecline-snapshots
        run: |
          set -e
          # Reuse the clone the snapshot step already made rather than pulling the
          # whole archive a second time in the same run — it was ~119MB fetched
          # twice an hour for identical content. Still clones if that step failed
          # before it got that far.
          if [ ! -d /tmp/snapshots/snapshots ]; then
            echo "No clone from the snapshot step — cloning."
            git clone --depth 1 "https://x-access-token:${SNAPSHOTS_TOKEN}@github.com/${SNAPSHOTS_REPO}.git" /tmp/snapshots
          fi
          SNAPSHOTS_DIR=/tmp/snapshots/snapshots python scripts/build-view-velocity.py
          SNAPSHOTS_DIR=/tmp/snapshots/snapshots python scripts/build-ad-ledger.py
          SNAPSHOTS_DIR=/tmp/snapshots/snapshots python scripts/build-historic-views.py
          SNAPSHOTS_DIR=/tmp/snapshots/snapshots node scripts/build-daily-views.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/view-velocity.json public/ad-ledger.json public/historic-views.json public/daily-views.json
          if git diff --staged --quiet; then
            echo "view-velocity/ad-ledger unchanged."
            exit 0
          fi
          git commit -m "chore: rebuild view-velocity + ad-ledger ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git push; then
              echo "view-velocity push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "view-velocity push failed after 3 attempts."
          exit 1

      - name: Snapshot staleness tripwire
        # Deliberately NOT continue-on-error. The snapshot and rebuild steps
        # above are best-effort by design, which means a dead SNAPSHOTS token
        # (or a broken sister repo) keeps every run green while the archive
        # silently stops growing — and View Velocity, the ad ledger and
        # historic views quietly freeze with it. This step turns that silence
        # into a red run and a failure email within a day: snapshots land
        # twice daily (max normal gap ~12h), so 36h+ since the sister repo's
        # last commit means at least two halves genuinely failed.
        env:
          SNAPSHOTS_TOKEN: ${{ secrets.SNAPSHOTS_REPO_TOKEN }}
          SNAPSHOTS_REPO: jerminaldecline/jerminaldecline-snapshots
        run: |
          set -e
          # MUST stay filtered to the snapshots/ path. The debut sampler now commits
          # to this repo every hour, so "newest commit" would always look fresh and
          # this tripwire would never fire again even with the full dumps dead.
          LATEST=$(curl -sf --retry 3 -H "Authorization: Bearer ${SNAPSHOTS_TOKEN}" \
            "https://api.github.com/repos/${SNAPSHOTS_REPO}/commits?path=snapshots&per_page=1" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)[0]['commit']['committer']['date'])")
          AGE_H=$(python3 -c "import sys, datetime; d = datetime.datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00')); print(int((datetime.datetime.now(datetime.timezone.utc) - d).total_seconds() // 3600))" "$LATEST")
          echo "Newest snapshots-repo commit: ${LATEST} (${AGE_H}h ago)"
          if [ "$AGE_H" -ge 36 ]; then
            echo "::error::Snapshot archive is stale: ${AGE_H}h since the last commit to ${SNAPSHOTS_REPO} (expected <24h). Likely a dead SNAPSHOTS_REPO_TOKEN or a failing snapshot step — check the 'Snapshot data' step logs of recent runs."
            exit 1
          fi
