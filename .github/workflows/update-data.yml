name: Update channel data

on:
  schedule:
    # Multiple staggered runs daily. GitHub's free-tier scheduler is
    # unreliable and often skips runs scheduled on the hour, so we
    # use off-hour minutes and three attempts across the day.
    # Only the first run that finds new data will produce a commit.
    - cron: '17 3 * * *'   # 03:17 UTC — primary, early morning
    - cron: '37 11 * * *'  # 11:37 UTC — midday backup
    - cron: '47 19 * * *'  # 19:47 UTC — evening backup
  workflow_dispatch:  # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run fetcher
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update channel data ($(date -u '+%Y-%m-%d'))"
            git push
          fi
