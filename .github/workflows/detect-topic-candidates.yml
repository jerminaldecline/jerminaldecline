name: Detect topic candidates

on:
  schedule:
    # Once daily at 04:30 UTC. Sits after the AM data update (00:07/03:17)
    # so it sees the freshest descriptions when it runs, and before the
    # noisy PM cycle so the report is settled by the time you wake up.
    - cron: '30 4 * * *'
  workflow_dispatch:  # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run detection
        run: node scripts/detect-topic-candidates.js

      - name: Commit topic candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/topic-candidates.md public/topic-trackers.json
          if git diff --staged --quiet; then
            echo "No topic candidate changes to commit."
            exit 0
          fi
          git commit -m "chore: topic candidates ($(date -u '+%Y-%m-%d'))"
          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt. Rebasing on latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts."
          exit 1
